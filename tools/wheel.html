<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每日运势转盘 - 老六茶事</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg-page: #efe4d0; --bg-card: #ffffff;
  --green-deep: #1a3c2a; --green-mid: #2d5a3e;
  --gold: #d4af37; --gold-light: #f5e6b8; --gold-pale: #faf3e0;
  --text: #2c2c2c; --text-light: #888;
  --border: #e8e0d6;
  --radius: 14px; --radius-sm: 10px;
}
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Serif SC", serif;
  background: var(--bg-page); color: var(--text); min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
}
.header {
  width: 100%;
  background: linear-gradient(135deg, var(--green-deep) 0%, #0f2b1e 100%);
  padding: 20px 16px; text-align: center; position: sticky; top: 0; z-index: 100;
}
.header h1 {
  font-size: 22px; font-weight: 700; letter-spacing: 2px;
  background: linear-gradient(135deg, var(--gold) 0%, #e8c840 50%, var(--gold) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.header .sub { font-size: 11px; color: rgba(212,175,55,0.6); margin-top: 3px; }
.header .back-link {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  color: var(--gold); font-size: 13px; text-decoration: none;
  display: flex; align-items: center; gap: 4px;
}
.wrap {
  max-width: 480px; width: 100%; padding: 24px 20px;
  display: flex; flex-direction: column; align-items: center;
}

/* Wheel area */
.wheel-area { position: relative; width: 300px; height: 300px; margin-bottom: 20px; }
#wheelCanvas { width: 300px; height: 300px; border-radius: 50%; box-shadow: 0 4px 30px rgba(26,60,42,0.2); }
.pointer {
  position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-top: 28px solid var(--green-deep);
  z-index: 10;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}
.pointer::after {
  content: '▼'; position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
  font-size: 10px; color: var(--gold);
}

/* Spin button */
.spin-btn {
  display: block; width: 200px; padding: 14px;
  background: linear-gradient(135deg, var(--green-deep), var(--green-mid));
  color: var(--gold); border: none; border-radius: 50px;
  font-size: 18px; font-weight: 700; cursor: pointer;
  transition: all 0.2s; letter-spacing: 2px; margin-bottom: 16px;
  box-shadow: 0 4px 16px rgba(26,60,42,0.2);
}
.spin-btn:active { transform: scale(0.95); }
.spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Spin info */
.spin-info { text-align: center; font-size: 13px; color: var(--text-light); margin-bottom: 16px; }
.spin-info #spinsLeft { color: var(--green-deep); font-weight: 700; font-size: 16px; }
.spin-info.exhausted { color: var(--gold); font-weight: 600; }

/* Prize list */
.prize-list {
  width: 100%; max-width: 360px;
  background: var(--bg-card); border-radius: var(--radius);
  padding: 16px 20px; box-shadow: 0 2px 12px rgba(26,60,42,0.08);
}
.prize-list h3 { font-size: 14px; color: var(--green-deep); margin-bottom: 10px; text-align: center; }
.pl-item {
  display: flex; justify-content: space-between;
  padding: 6px 0; font-size: 13px; border-bottom: 1px solid #f0ebe3;
}
.pl-item:last-child { border-bottom: none; }
.pl-item .pli-name { color: var(--text); }
.pl-item .pli-rate { color: var(--text-light); font-size: 11px; }
.pl-item .pli-rate.gold { color: var(--gold); font-weight: 600; }

/* Modal overlay */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 999;
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: var(--bg-card); border-radius: var(--radius);
  padding: 28px 24px; max-width: 340px; width: 100%;
  text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.2);
  animation: modalIn 0.3s ease;
}
@keyframes modalIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.modal-box .mb-icon { font-size: 48px; margin-bottom: 12px; }
.modal-box h3 { font-size: 22px; color: var(--green-deep); margin-bottom: 8px; }
.modal-box .mb-result { font-size: 14px; color: var(--text-light); margin-bottom: 16px; line-height: 1.6; }
.modal-box .mb-btn {
  display: inline-block; padding: 12px 36px;
  background: linear-gradient(135deg, var(--green-deep), var(--green-mid));
  color: var(--gold); border: none; border-radius: 50px;
  font-size: 15px; font-weight: 600; cursor: pointer;
}
.modal-box .mb-btn:active { transform: scale(0.95); }
.modal-box .mb-close {
  display: inline-block; margin-top: 10px;
  color: var(--text-light); font-size: 13px; cursor: pointer;
  background: none; border: none; text-decoration: underline;
}

/* Grand prize special */
.grand-box { background: linear-gradient(135deg, #1a3c2a, #2a5a3e); }
.grand-box h3 { color: var(--gold); }
.grand-box .mb-result { color: rgba(255,255,255,0.7); }
.grand-box .mb-btn { background: var(--gold); color: var(--green-deep); }

.footer { text-align: center; padding: 20px; color: var(--text-light); font-size: 11px; max-width: 480px; }

/* Confetti */
.confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; overflow: hidden; }
.confetti-piece {
  position: absolute; width: 10px; height: 10px; top: -20px;
  animation: confettiFall 3s ease-in forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
</style>
</head>
<body>

<div class="header">
  <a href="/" class="back-link">← 返回首页</a>
  <h1>🎡 每日运势转盘</h1>
  <div class="sub">老六茶事 · 转动好运</div>
</div>

<div class="wrap">
  <div class="wheel-area">
    <canvas id="wheelCanvas" width="600" height="600"></canvas>
    <div class="pointer"></div>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="spin()">🎯 转动运势</button>

  <div class="prize-list">
    <h3>🎁 每日3次 · 奖项设置</h3>
    <div class="pl-item"><span class="pli-name">👑 老六免费一卦</span><span class="pli-rate gold">10%</span></div>
    <div class="pl-item"><span class="pli-name">🌟 大吉</span><span class="pli-rate">20%</span></div>
    <div class="pl-item"><span class="pli-name">🍀 小吉</span><span class="pli-rate">25%</span></div>
    <div class="pl-item"><span class="pli-name">🤝 比助</span><span class="pli-rate">20%</span></div>
    <div class="pl-item"><span class="pli-name">⚠️ 小凶</span><span class="pli-rate">15%</span></div>
    <div class="pl-item"><span class="pli-name">💀 大凶</span><span class="pli-rate">10%</span></div>
  </div>
  <div class="spin-info" id="spinInfo">今日剩余 <span id="spinsLeft">3</span> 次</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" id="modalBox">
    <div class="mb-icon" id="modalIcon">🎉</div>
    <h3 id="modalTitle">恭喜！</h3>
    <div class="mb-result" id="modalResult">你抽到了</div>
    <button class="mb-btn" onclick="closeModal()">再来一次</button>
    <br><button class="mb-close" onclick="closeModal()">关闭</button>
  </div>
</div>

<div class="footer">© 老六茶事 · 内容仅供娱乐参考</div>

<div class="confetti-container" id="confettiContainer"></div>

<!-- Hidden canvas for certificate -->
<canvas id="certCanvas" width="800" height="1120" style="display:none"></canvas>

<!-- Grand Prize Certificate Area (shown inside modal) -->
<div id="grandPrizeContent" style="display:none;">
  <img id="certImage" style="width:100%;max-width:320px;border-radius:10px;margin-bottom:12px;box-shadow:0 4px 16px rgba(0,0,0,0.15);">
  <button class="mb-btn" onclick="downloadCert()">📥 下载凭证</button>
  <br><button class="mb-close" onclick="closeModal()">关闭</button>
  <div style="margin-top:12px;font-size:12px;color:#888;line-height:1.6;background:#f5f0e8;padding:12px;border-radius:8px;">
    💡 保存此凭证截图，加微信号 <strong style="color:#1a3c2a;">laoliuchashi</strong> 备注"免费一卦"即可兑奖
  </div>
</div>

<script>
// ===== Segments (weight-based) =====
const SEGMENTS = [
  { label: '老六免费一卦', weight: 10, color: '#FFD700', icon: '👑', desc: '恭喜获得老六免费一卦！请加微信 laoliuchashi，老六亲自为你解卦一次。', special: true },
  { label: '大吉',           weight: 20, color: '#e74c3c', icon: '🌟', desc: '大吉大利！今日万事顺遂，运势极佳，宜大胆行动，把握良机。' },
  { label: '小吉',           weight: 25, color: '#27ae60', icon: '🍀', desc: '小吉之兆。今日虽有波折但整体向好，稳扎稳打必有收获。' },
  { label: '比助',           weight: 20, color: '#3498db', icon: '🤝', desc: '比助之象。今日宜合作共赢，与人配合胜过单打独斗，顺势而为。' },
  { label: '小凶',           weight: 15, color: '#9b59b6', icon: '⚠️', desc: '小凶，宜谨慎。今日不宜冒进，做好本职即可，冲动易招损失。' },
  { label: '大凶',           weight: 10, color: '#7f8c8d', icon: '💀', desc: '大凶，宜守不宜攻。今天诸事不宜，建议低调蛰伏，以静制动。' }
];

const TOTAL_WEIGHT = SEGMENTS.reduce((s, seg) => s + seg.weight, 0);

let isSpinning = false;
let currentAngle = 0;

// ===== Daily Limit (3 spins per day) =====
function getTodayKey() {
  const d = new Date();
  return 'wheel_spins_' + d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2);
}
function getSpinsLeft() {
  const count = parseInt(localStorage.getItem(getTodayKey()) || '0');
  return Math.max(0, 3 - count);
}
function recordSpin() {
  const key = getTodayKey();
  localStorage.setItem(key, parseInt(localStorage.getItem(key) || '0') + 1);
}
function updateSpinUI() {
  const left = getSpinsLeft();
  document.getElementById('spinsLeft').textContent = left;
  const info = document.getElementById('spinInfo');
  info.classList.toggle('exhausted', left === 0);
  document.getElementById('spinBtn').disabled = left === 0;
  document.getElementById('spinBtn').textContent = left > 0 ? '🎯 转动运势（剩' + left + '次）' : '⏰ 今日已用完，明日再来';
}

function drawWheel() {
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const cx = 300, cy = 300, r = 290;

  ctx.clearRect(0, 0, 600, 600);

  // Draw outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#1a3c2a';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Draw segments
  let startAngle = currentAngle;
  SEGMENTS.forEach((seg, i) => {
    const sliceAngle = (seg.weight / TOTAL_WEIGHT) * Math.PI * 2;
    const endAngle = startAngle + sliceAngle;

    // Fill
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();

    // Border
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Text (label rotated)
    const midAngle = startAngle + sliceAngle / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(midAngle);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 3;
    
    // Icon
    ctx.font = '22px sans-serif';
    ctx.fillText(seg.icon, r - 15, 7);
    
    // Label
    ctx.font = '14px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(seg.label, r - 48, 7);
    
    ctx.restore();

    startAngle = endAngle;
  });

  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 40, 0, Math.PI * 2);
  ctx.fillStyle = '#1a3c2a';
  ctx.fill();
  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Center text
  ctx.fillStyle = '#d4af37';
  ctx.font = 'bold 18px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('运势', cx, cy - 8);
  ctx.font = '11px "PingFang SC", sans-serif';
  ctx.fillText('LUCK', cx, cy + 14);
}

function getRandomSegment() {
  const rand = Math.random() * TOTAL_WEIGHT;
  let accum = 0;
  for (let i = 0; i < SEGMENTS.length; i++) {
    accum += SEGMENTS[i].weight;
    if (rand < accum) return i;
  }
  return SEGMENTS.length - 1;
}

function spin() {
  if (isSpinning) return;
  if (getSpinsLeft() <= 0) {
    alert('今日抽奖次数已用完，明天再来吧！');
    return;
  }
  isSpinning = true;
  document.getElementById('spinBtn').disabled = true;

  // Pick result
  const winnerIdx = getRandomSegment();
  
  // Record this spin
  recordSpin();
  
  // Calculate target angle: land on the middle of the winning segment
  // The pointer is at the top (12 o'clock position = -Math.PI/2 or 3*Math.PI/2)
  // We need to rotate the wheel so the winning segment is under the pointer
  
  // Calculate the angle of each segment from start
  let segStart = 0;
  for (let i = 0; i < winnerIdx; i++) {
    segStart += (SEGMENTS[i].weight / TOTAL_WEIGHT) * Math.PI * 2;
  }
  const segMid = segStart + ((SEGMENTS[winnerIdx].weight / TOTAL_WEIGHT) * Math.PI * 2) / 2;
  
  // The pointer is at top (angle = -Math.PI/2 in standard coords)
  // We want the segment midpoint at the top
  // So we need to rotate so that segMid aligns with top
  // top = -PI/2, so targetAngle = -PI/2 - segMid
  // Add random spins (5-8 full rotations)
  const spins = 5 + Math.random() * 3;
  const targetAngle = currentAngle + spins * Math.PI * 2 + (Math.PI * 3 / 2 - segMid);
  
  // Animate
  const startAngle = currentAngle;
  const totalRotation = targetAngle - startAngle;
  const duration = 4000; // 4 seconds
  const startTime = performance.now();

  function animate(time) {
    const elapsed = time - startTime;
    const progress = Math.min(elapsed / duration, 1);
    
    // Easing: cubic ease-out
    const eased = 1 - Math.pow(1 - progress, 3);
    
    currentAngle = startAngle + totalRotation * eased;
    drawWheel();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      // Done spinning
      isSpinning = false;
      updateSpinUI();
      showResult(winnerIdx);
    }
  }

  requestAnimationFrame(animate);
}

function showResult(idx) {
  const seg = SEGMENTS[idx];
  const modal = document.getElementById('modal');
  const box = document.getElementById('modalBox');
  
  if (seg.special) {
    // Grand prize: show certificate instead of standard modal content
    document.getElementById('modalIcon').style.display = 'none';
    document.getElementById('modalTitle').style.display = 'none';
    document.getElementById('modalResult').style.display = 'none';
    // Hide standard buttons
    const stdBtn = box.querySelector('.mb-btn:not([onclick*="downloadCert"])');
    const stdClose = box.querySelector('.mb-close');
    if (stdBtn) stdBtn.style.display = 'none';
    if (stdClose) stdClose.style.display = 'none';
    
    box.className = 'modal-box';
    box.style.padding = '16px';
    box.style.maxWidth = '360px';
    box.style.background = '#faf6ef';
    
    // Show certificate content
    document.getElementById('grandPrizeContent').style.display = 'block';
    generateCertificate();
    
    launchConfetti();
  } else {
    document.getElementById('modalIcon').style.display = 'block';
    document.getElementById('modalTitle').style.display = 'block';
    document.getElementById('modalResult').style.display = 'block';
    document.getElementById('grandPrizeContent').style.display = 'none';
    
    document.getElementById('modalIcon').textContent = seg.icon;
    document.getElementById('modalTitle').textContent = seg.label;
    document.getElementById('modalResult').textContent = seg.desc;
    
    box.className = 'modal-box';
    box.style.padding = '28px 24px';
    box.style.maxWidth = '340px';
    box.style.background = '#fff';
    
    const btn = box.querySelector('.mb-btn');
    if (btn) {
      btn.style.display = 'inline-block';
      btn.textContent = '再来一次';
      btn.onclick = closeModal;
    }
    const closeBtn = box.querySelector('.mb-close');
    if (closeBtn) closeBtn.style.display = 'inline-block';
  }
  
  modal.classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  document.getElementById('grandPrizeContent').style.display = 'none';
}

// ===== Certificate Generation =====
let currentCertId = '';

function generateCertificate() {
  const canvas = document.getElementById('certCanvas');
  const ctx = canvas.getContext('2d');
  const W = 800, H = 1120;
  
  // Generate unique certificate ID
  const now = new Date();
  const dateStr = now.getFullYear() + ('0'+(now.getMonth()+1)).slice(-2) + ('0'+now.getDate()).slice(-2);
  const rand = Math.floor(1000 + Math.random() * 9000);
  currentCertId = 'LLCS-' + dateStr + '-' + rand;
  
  // Save to localStorage
  const certs = JSON.parse(localStorage.getItem('wheel_certificates') || '[]');
  certs.push({ id: currentCertId, date: dateStr, claimed: false });
  localStorage.setItem('wheel_certificates', JSON.stringify(certs));
  
  // Draw certificate
  ctx.clearRect(0, 0, W, H);
  
  // Background
  ctx.fillStyle = '#faf6ef';
  ctx.fillRect(0, 0, W, H);
  
  // Outer border
  ctx.strokeStyle = '#1a3c2a';
  ctx.lineWidth = 12;
  ctx.strokeRect(30, 30, W-60, H-60);
  
  // Inner gold border
  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = 4;
  ctx.strokeRect(50, 50, W-100, H-100);
  
  // Corner decorations
  const corners = [[60,60], [W-60,60], [60,H-60], [W-60,H-60]];
  corners.forEach(([x,y]) => {
    ctx.fillStyle = '#d4af37';
    ctx.font = '40px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏮', x, y);
  });
  
  // Title area - dark green banner
  ctx.fillStyle = '#1a3c2a';
  roundRect(ctx, 100, 120, W-200, 80, 12);
  
  ctx.fillStyle = '#d4af37';
  ctx.font = 'bold 40px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🎉 免费一卦 · 兑奖凭证', W/2, 160);
  
  // Decorative line
  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(120, 250);
  ctx.lineTo(W-120, 250);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // Certificate ID
  ctx.fillStyle = '#888';
  ctx.font = '18px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('编号：' + currentCertId, W/2, 290);
  
  // Hexagram decoration
  ctx.font = '80px sans-serif';
  ctx.fillText('☯', W/2, 400);
  
  // Prize description
  ctx.fillStyle = '#1a3c2a';
  ctx.font = 'bold 28px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('老六免费一卦', W/2, 510);
  
  ctx.fillStyle = '#666';
  ctx.font = '20px "PingFang SC", sans-serif';
  ctx.fillText('凭此凭证可找老六为你卜一卦', W/2, 555);
  
  // Date
  ctx.fillStyle = '#999';
  ctx.font = '18px "PingFang SC", sans-serif';
  ctx.fillText('发放日期：' + now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日', W/2, 620);
  
  // Separator
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(120, 670);
  ctx.lineTo(W-120, 670);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // WeChat info
  ctx.fillStyle = '#1a3c2a';
  ctx.font = 'bold 22px "PingFang SC", sans-serif';
  ctx.fillText('📱 联系兑奖', W/2, 730);
  
  ctx.fillStyle = '#555';
  ctx.font = '18px "PingFang SC", sans-serif';
  ctx.fillText('微信号：laoliuchashi', W/2, 775);
  ctx.font = '16px "PingFang SC", sans-serif';
  ctx.fillText('添加时备注"免费一卦"', W/2, 810);
  
  // Bottom branding
  ctx.fillStyle = '#1a3c2a';
  ctx.font = '16px "PingFang SC", sans-serif';
  ctx.fillText('老六茶事 · laoliuchashi.top', W/2, 920);
  
  ctx.fillStyle = '#bbb';
  ctx.font = '14px "PingFang SC", sans-serif';
  ctx.fillText('内容仅供娱乐参考，请理性看待', W/2, 960);
  
  // Convert to image and show
  const img = document.getElementById('certImage');
  img.src = canvas.toDataURL('image/png');
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
}

function downloadCert() {
  const canvas = document.getElementById('certCanvas');
  const link = document.createElement('a');
  link.download = '老六免费一卦_' + currentCertId + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// Confetti for grand prize
function launchConfetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#FFD700', '#e74c3c', '#27ae60', '#3498db', '#9b59b6', '#e67e22', '#FF6B6B'];
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.width = (Math.random() * 8 + 4) + 'px';
    piece.style.height = (Math.random() * 8 + 4) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    container.appendChild(piece);
  }
  setTimeout(() => { container.innerHTML = ''; }, 4000);
}

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {

  --radius: 14px; --radius-sm: 10px;

body {

.header {

  padding: 20px 16px; text-align: center; position: sticky; top: 0; z-index: 100;

.header h1 {
  font-size: 22px; font-weight: 700; letter-spacing: 2px;
  background: linear-gradient(135deg, var(--gold) 0%, #e8c840 50%, var(--gold) 100%);

}
.header .sub { font-size: 11px; color: rgba(212,175,55,0.6); margin-top: 3px; }
.header .back-link {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  color: var(--gold); font-size: 13px; text-decoration: none;
  display: flex; align-items: center; gap: 4px;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 16px; }

/* Mode selection */
.mode-btns { display: flex; gap: 10px; margin-bottom: 16px; }
.mode-btn {
  flex: 1; padding: 14px; border: 2px solid var(--border); border-radius: var(--radius);
  background: var(--bg-card); cursor: pointer; text-align: center;
  transition: all 0.2s; font-size: 15px; color: var(--text-light);
}
.mode-btn .mb-icon { font-size: 28px; display: block; margin-bottom: 4px; }
.mode-btn.active {
  border-color: var(--gold); background: var(--gold-pale);
  color: var(--green-deep); font-weight: 600;
}

/* Input section */
.input-section {
  background: var(--bg-card); border-radius: var(--radius); padding: 20px;
  box-shadow: 0 2px 12px rgba(26,60,42,0.08); margin-bottom: 16px;
}
.input-section h3 { font-size: 16px; color: var(--green-deep); margin-bottom: 14px; }
.form-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.form-group { flex: 1; min-width: 80px; }
.form-group label {
  display: block; font-size: 12px; color: var(--text-light); margin-bottom: 4px;
}
.form-group select, .form-group input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 15px; background: var(--bg-page);
  color: var(--text); font-family: inherit;
}
.form-group select:focus, .form-group input:focus {
  outline: none; border-color: var(--gold);
}

.btn-primary {
  display: block; width: 100%; padding: 14px;
  background: linear-gradient(135deg, var(--green-deep), var(--green-mid));
  color: var(--gold); border: none; border-radius: var(--radius);
  font-size: 17px; font-weight: 600; cursor: pointer;
  transition: all 0.2s; letter-spacing: 2px;
}
.btn-primary:active { transform: scale(0.97); opacity: 0.9; }

/* Result section */
.result-section {
  background: var(--bg-card); border-radius: var(--radius); padding: 24px 20px;
  box-shadow: 0 2px 12px rgba(26,60,42,0.08); margin-bottom: 16px;
  display: none;
}
.result-section.show { display: block; }

.hexagram-display { text-align: center; padding: 20px 0; }
.hexagram-name { font-size: 28px; color: var(--green-deep); font-weight: 700; margin-bottom: 6px; }
.hexagram-sub { font-size: 14px; color: var(--text-light); margin-bottom: 16px; }

/* Yao lines */
.yao-container { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 16px; }
.yao-line {
  width: 140px; height: 12px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.yao-line.yang {
  background: var(--green-deep); border-radius: 3px; height: 12px; width: 140px;
}
.yao-line.yin {
  display: flex; justify-content: space-between; width: 140px; height: 12px;
}
.yao-line.yin .yl-piece {
  width: 58px; height: 12px; background: var(--green-deep); border-radius: 3px;
}
.yao-label {
  position: absolute; right: -40px; font-size: 11px; color: var(--text-muted);
}

.yao-row { display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 4px; }
.yao-row .yr-label {
  position: absolute; left: calc(50% + 80px); font-size: 11px; color: var(--text-light); white-space: nowrap;
}
.yao-row .yr-label .yr-lightning { color: var(--gold); font-weight: bold; }

/* Info grid */
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.info-item {
  background: var(--green-light); border-radius: var(--radius-sm); padding: 12px;
  text-align: center;
}
.info-item .ii-label { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
.info-item .ii-value { font-size: 18px; color: var(--green-deep); font-weight: 700; }
.info-item .ii-sub { font-size: 12px; color: var(--text-light); margin-top: 2px; }

.judgment-box {
  background: var(--gold-pale); border-left: 4px solid var(--gold);
  border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 16px;
}
.judgment-box .jb-label { font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
.judgment-box .jb-text { font-size: 14px; color: var(--text); line-height: 1.8; }

.cta-box {
  background: linear-gradient(135deg, var(--green-deep), #153322);
  border-radius: var(--radius); padding: 18px; text-align: center;
  margin-top: 16px;
}
.cta-box h4 { color: var(--gold); font-size: 16px; margin-bottom: 4px; }
.cta-box p { color: rgba(255,255,255,0.6); font-size: 12px; line-height: 1.6; }
.cta-box .cta-id {

.cta-box .cta-btn {

  background: var(--gold); color: var(--green-deep); border: none;
  border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
  cursor: pointer; text-decoration: none;
}
.cta-box .cta-btn:active { opacity: 0.8; }

.footer { text-align: center; padding: 20px 16px; color: var(--text-light); font-size: 11px; }
</style>

  const selY = document.getElementById('selYear');
  for (let i = y - 5; i <= y + 1; i++) {
    const o = document.createElement('option');
    o.value = i; o.textContent = i + '年';
    if (i === y) o.selected = true;
    selY.appendChild(o);
  }
  
  // Month select
  const selM = document.getElementById('selMonth');
  for (let i = 1; i <= 12; i++) {
    const o = document.createElement('option');
    o.value = i; o.textContent = i + '月';
    if (i === now.getMonth() + 1) o.selected = true;
    selM.appendChild(o);
  }
  
  // Day select
  const selD = document.getElementById('selDay');
  for (let i = 1; i <= 31; i++) {
    const o = document.createElement('option');
    o.value = i; o.textContent = i + '日';
    if (i === now.getDate()) o.selected = true;
    selD.appendChild(o);
  }
  
  // Current hour auto-select
  const h = now.getHours();
  const hourIdx = Math.floor((h + 1) / 2) + 1;
  document.getElementById('selHour').value = Math.min(hourIdx, 12);
})();

function switchMode(mode) {
  document.getElementById('modeTime').classList.toggle('active', mode === 'time');
  document.getElementById('modeNum').classList.toggle('active', mode === 'number');
  document.getElementById('timeInput').style.display = mode === 'time' ? 'block' : 'none';
  document.getElementById('numInput').style.display = mode === 'number' ? 'block' : 'none';
  document.getElementById('result').classList.remove('show');
}

function getTrigramName(num) {
  const n = ((num - 1) % 8) + 1;
  return TRIGRAMS[n];
}

function getHexagram(upper, lower) {
  const h = HEX_LOOKUP[lower][upper];
  if (!h) return null;
  return HEX_DATA[h];
}

function buildYaoLines(upperNum, lowerNum) {
  // 先天数 → 二进制编码 (从下往上: 初爻=bit0, 二爻=bit1, 三爻=bit2)
  // 乾111(1), 兑110(2), 离101(3), 震100(4), 巽011(5), 坎010(6), 艮001(7), 坤000(8)
  // 转换公式: binary = 8 - xiantianNum
  const upperBits = 8 - upperNum;
  const lowerBits = 8 - lowerNum;
  // 爻从上往下显示，所以bit0(LSB)=上爻, bit1=中爻, bit2=初爻
  const upperYao = [
    (upperBits & 1) ? 1 : 0,  // LSB → 上爻 (top)
    (upperBits & 2) ? 1 : 0,  // bit1 → 五爻 (middle)
    (upperBits & 4) ? 1 : 0   // MSB → 四爻 (bottom of upper)
  ];
  const lowerYao = [
    (lowerBits & 1) ? 1 : 0,  // LSB → 三爻 (top of lower)
    (lowerBits & 2) ? 1 : 0,  // bit1 → 二爻 (middle)
    (lowerBits & 4) ? 1 : 0   // MSB → 初爻 (bottom)
  ];
  // Full 6 lines: top to bottom = upper[0], upper[1], upper[2], lower[0], lower[1], lower[2]
  return [...upperYao, ...lowerYao];
}

function renderYaoLines(lines, movingYin = -1) {
  const container = document.getElementById('yaoContainer');
  const yaoNames = ['初爻','二爻','三爻','四爻','五爻','上爻'];
  container.innerHTML = lines.map((line, idx) => {
    const isYang = line === 1;
    const isMoving = idx === movingYin;
    const lineHtml = isYang
      ? '<div class="yao-line yang"></div>'
      : '<div class="yao-line yin"><div class="yl-piece"></div><div class="yl-piece"></div></div>';
    const label = isMoving
      ? `<span class="yr-label">${yaoNames[5-idx]} <span class="yr-lightning">⚡</span></span>`
      : `<span class="yr-label">${yaoNames[5-idx]}</span>`;
    return `<div class="yao-row">${lineHtml}${label}</div>`;
  }).join('');
}

function getShengKe(selfElem, otherElem) {
  // 五行生克
  const cycle = { '金': ['土','水'], '水': ['金','木'], '木': ['水','火'], '火': ['木','土'], '土': ['火','金'] };
  // cycle[elem] = [生我者, 我生者]
  const sheng = {
    '金': { '土': '生', '水': '生' },
    '水': { '金': '生', '木': '生' },
    '木': { '水': '生', '火': '生' },
    '火': { '木': '生', '土': '生' },
    '土': { '火': '生', '金': '生' }
  };
  const ke = {
    '金': { '木': '克' },
    '木': { '土': '克' },
    '土': { '水': '克' },
    '水': { '火': '克' },
    '火': { '金': '克' }
  };
  
  // 体生用 / 用生体 / 体克用 / 用克体 / 体用比和
  if (selfElem === otherElem) return '比和', '体用比和，五行相同，诸事顺遂。双方气场相合，宜合作共事。';
  
  // Check 生
  if (sheng[selfElem] && sheng[selfElem][otherElem]) return '用生体', '用生体，吉。他人或外部环境对你有助益，事情进展顺利，宜乘势而为。';
  if (sheng[otherElem] && sheng[otherElem][selfElem]) return '体生用', '体生用，先劳后逸。你需要付出较多，但最终会有收获，宜坚持努力。';
  
  // Check 克
  if (ke[selfElem] && ke[selfElem][otherElem]) return '体克用', '体克用，吉中带劳。你能掌控局面，但过程辛苦，宜坚定信念。';
  if (ke[otherElem] && ke[otherElem][selfElem]) return '用克体', '用克体，凶。外部环境压力较大，宜守不宜攻，谨慎决策。';
  
  return '平', '体用关系平和，无明显的生克影响，顺其自然即可。';
}

function getChangedTrigram(upperNum, lowerNum, movingYin) {
  // 先天数变二进制: binary = 8 - num
  // bit0(LSB)=上爻, bit1=五/二爻, bit2(MSB)=四/初爻
  let upperBits = 8 - upperNum;
  let lowerBits = 8 - lowerNum;
  
  if (movingYin >= 3) {
    // Upper trigram: 上爻=bit0, 五爻=bit1, 四爻=bit2 (从下往上翻)
    const bit = [1, 2, 4][movingYin - 3];
    upperBits = upperBits ^ bit;
  } else {
    // Lower trigram: 三爻=bit0, 二爻=bit1, 初爻=bit2
    const bit = [1, 2, 4][movingYin];
    lowerBits = lowerBits ^ bit;
  }
  
  // 转回先天数: xiantian = 8 - binary
  return [8 - upperBits, 8 - lowerBits];
}

function divinate(yy, mm, dd, hh, nums) {
  // nums: [num1, num2, num3] for number mode
  let upper, lower, moving;
  
  if (nums) {
    // Number mode
    upper = ((nums[0] - 1) % 8) + 1;
    lower = ((nums[1] - 1) % 8) + 1;
    moving = ((nums[2] - 1) % 6); // 0-5 = 初爻到上爻
  } else {
    // Time mode
    const sum1 = yy + mm + dd;
    const sum2 = yy + mm + dd + hh;
    upper = ((sum1 - 1) % 8) + 1;
    lower = ((sum2 - 1) % 8) + 1;
    moving = ((sum2 - 1) % 6);
  }
  
  const upperTri = TRIGRAMS[upper];
  const lowerTri = TRIGRAMS[lower];
  const hexagram = getHexagram(upper, lower);
  if (!hexagram) return;
  
  // Changed trigram
  const [newUpper, newLower] = getChangedTrigram(upper, lower, moving);
  const changedHex = getHexagram(newUpper, newLower);
  const newUpperTri = TRIGRAMS[newUpper];
  const newLowerTri = TRIGRAMS[newLower];
  
  // 体用: 体卦=下卦(自己), 用卦=上卦(外部+动爻所在)
  // 若动爻在上卦, 则上卦为用/下卦为体; 若动爻在下卦, 则下卦为用/上卦为体
  let selfTri, otherTri;
  if (moving >= 3) {
    // 动爻在上卦 → 上卦为用
    selfTri = lowerTri;
    otherTri = upperTri;
  } else {
    // 动爻在下卦 → 下卦为用
    selfTri = upperTri;
    otherTri = lowerTri;
  }
  
  const [skLabel, skText] = getShengKe(selfTri.element, otherTri.element);
  
  // Render
  document.getElementById('hexName').textContent = hexagram.n;
  document.getElementById('hexSub').textContent = `${upperTri.symbol}${lowerTri.symbol} ${upperTri.name}为${upperTri.image} · ${lowerTri.name}为${lowerTri.image}`;
  
  const lines = buildYaoLines(upper, lower);
  renderYaoLines(lines, moving);
  
  document.getElementById('infoOriginal').textContent = hexagram.n;
  document.getElementById('infoOrigSub').textContent = `${upperTri.name}(${upperTri.element}) · ${lowerTri.name}(${lowerTri.element})`;
  if (changedHex) {
    document.getElementById('infoChanged').textContent = changedHex.n;
    document.getElementById('infoChgSub').textContent = `${newUpperTri.name}(${newUpperTri.element}) · ${newLowerTri.name}(${newLowerTri.element})`;
  } else {
    document.getElementById('infoChanged').textContent = '—';
    document.getElementById('infoChgSub').textContent = '无变卦';
  }
  document.getElementById('infoSelf').textContent = `${selfTri.name}(${selfTri.element})`;
  document.getElementById('infoOther').textContent = `${otherTri.name}(${otherTri.element})`;
  
  document.getElementById('shengkeText').textContent = `${skLabel}。${skText}`;
  document.getElementById('judgmentText').textContent = `【${hexagram.n}】${hexagram.j}\n${hexagram.i}`;
  
  document.getElementById('result').classList.add('show');
  document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function divinateByTime() {
  const yy = parseInt(document.getElementById('selYear').value);
  const mm = parseInt(document.getElementById('selMonth').value);
  const dd = parseInt(document.getElementById('selDay').value);
  const hh = parseInt(document.getElementById('selHour').value);
  
  if (!yy || !mm || !dd || !hh) {
    alert('请完整选择年月日及时辰');
    return;
  }
  
  divinate(yy, mm, dd, hh, null);
}

function divinateByNumber() {
  const n1 = parseInt(document.getElementById('num1').value);
  const n2 = parseInt(document.getElementById('num2').value);
  const n3 = parseInt(document.getElementById('num3').value);
  
  if (!n1 || !n2 || !n3 || n1 < 1 || n2 < 1 || n3 < 1) {
    alert('请填写三个正整数（1-99）');
    return;
  }
  
  divinate(null, null, null, null, [n1, n2, n3]);
}

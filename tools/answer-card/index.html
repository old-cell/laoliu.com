<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>答案之书 · 老六茶事</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei','Noto Serif SC',serif;background:#1a1a2e;color:#e2e8f0;min-height:100vh;overflow-x:hidden}
.header{text-align:center;padding:24px 20px 6px}
.header h1{font-size:24px;color:#d4af37;letter-spacing:6px;font-weight:700}
.header .sub{font-size:11px;color:#64748b;letter-spacing:3px;margin-top:3px}
.q-area{padding:6px 20px;max-width:400px;margin:0 auto}
.q-area textarea{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(212,175,55,0.25);background:rgba(30,41,59,0.8);color:#e2e8f0;font-size:14px;font-family:inherit;resize:none;outline:none;min-height:60px}
.q-area textarea:focus{border-color:#d4af37}
.q-area textarea::placeholder{color:#475569}
.btn-row{display:flex;gap:10px;margin-top:8px;justify-content:center}
.btn{padding:10px 28px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s}
.btn-pri{background:linear-gradient(135deg,#d4af37,#b8942e);color:#1a1a2e}
.btn-pri:active{transform:scale(0.95)}
/* Deck */
.deck-area{position:fixed;bottom:30px;left:20px;z-index:10;width:90px;height:135px;cursor:pointer;transition:opacity 0.3s}
.deck-area img{width:100%;height:100%;object-fit:cover;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.deck-glow{position:absolute;inset:-4px;border-radius:10px;background:radial-gradient(ellipse,rgba(212,175,55,0.2),transparent 70%);animation:glow 2s ease-in-out infinite;pointer-events:none}
@keyframes glow{0%,100%{opacity:0.5}50%{opacity:1}}
.deck-count{position:absolute;top:-8px;right:-8px;background:#d4af37;color:#1a1a2e;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center}
/* === MOBILE: horizontal swipe === */
.swipe-area{display:none;position:fixed;bottom:20px;left:0;right:0;z-index:50;overflow-x:auto;overflow-y:hidden;padding:0 10px 10px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;gap:8px}
.swipe-area.show{display:flex}
.swipe-card{flex:0 0 auto;width:80px;height:120px;cursor:pointer;border-radius:6px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.5);transition:transform 0.2s;animation:slideIn 0.3s ease-out both}
.swipe-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.swipe-card:active{transform:scale(0.92)}
.swipe-card.selected{border:2px solid #d4af37;box-shadow:0 0 20px rgba(212,175,55,0.5)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
/* === DESKTOP: fan shape === */
.fan-overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.65);backdrop-filter:blur(3px);justify-content:center;align-items:center}
.fan-overlay.show{display:flex}
.fan-wrap{position:relative;width:100%;max-width:500px;aspect-ratio:4/3;margin:0 auto}
.fan-card{position:absolute;width:90px;height:135px;cursor:pointer;border-radius:6px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.5);transition:all 0.3s cubic-bezier(0.33,1,0.68,1);transform-origin:bottom center;animation:flyIn 0.4s ease-out both}
.fan-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.fan-card:hover{transform:translateY(-8px) scale(1.03)!important;z-index:100!important;box-shadow:0 8px 30px rgba(212,175,55,0.4)!important}
@keyframes flyIn{from{opacity:0}to{opacity:1}}
/* === Result overlay === */
.result-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);justify-content:center;align-items:center;flex-direction:column}
.result-overlay.show{display:flex}
.result-card{width:290px;height:435px;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6);border:2px solid #d4af37;position:relative;animation:cardReveal 0.9s cubic-bezier(0.33,1,0.68,1) both}
@keyframes cardReveal{0%{transform:rotateY(0deg) scale(0.4);opacity:0}40%{transform:rotateY(720deg) scale(1.05)}100%{transform:rotateY(720deg) scale(1);opacity:1}}
.result-card img{width:100%;height:100%;object-fit:cover;display:block}
.result-text{margin-top:14px;color:#d4af37;font-size:20px;font-weight:700;letter-spacing:3px;text-align:center;animation:fadeIn 0.8s 0.5s both}
.result-sub{margin-top:2px;color:#94a3b8;font-size:13px;letter-spacing:1px;animation:fadeIn 0.8s 0.7s both}
.result-actions{display:flex;gap:10px;margin-top:16px;animation:fadeIn 0.8s 0.9s both}
.btn-close{padding:8px 20px;border-radius:8px;border:1px solid rgba(212,175,55,0.3);background:transparent;color:#94a3b8;font-size:13px;cursor:pointer;font-family:inherit}
.btn-save{padding:8px 20px;border-radius:8px;border:none;background:linear-gradient(135deg,#d4af37,#b8942e);color:#1a1a2e;font-size:13px;cursor:pointer;font-weight:600;font-family:inherit}
.footer{text-align:center;padding:14px 20px 180px;color:#475569;font-size:11px}
@media(max-width:400px){.deck-area{width:75px;height:112px}.swipe-card{width:70px;height:105px}.result-card{width:250px;height:375px}}
@media(min-width:768px){.swipe-area{display:none!important}.deck-area{width:100px;height:150px}}
</style>
</head>
<body>

<div class="header">
  <h1>答 案 之 书</h1>
  <div class="sub">— 老六茶事 · 塔罗占卜 —</div>
</div>

<div class="q-area">
  <textarea id="qt" placeholder="心里默念你的问题…也可以写在这里（选填）"></textarea>
  <div class="btn-row"><button class="btn btn-pri" id="dealBtn">🎴 翻牌</button></div>
</div>

<div class="deck-area" id="deckArea">
  <div class="deck-glow"></div>
  <img src="卡牌背面.png" alt="牌叠">
  <div class="deck-count" id="deckCount">62</div>
</div>

<!-- Mobile: horizontal swipe -->
<div class="swipe-area" id="swipeArea"></div>

<!-- Desktop: fan overlay -->
<div class="fan-overlay" id="fanOverlay"><div class="fan-wrap" id="fanWrap"></div></div>

<!-- Result -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-card" id="resultCard"></div>
  <div class="result-text" id="resultText"></div>
  <div class="result-sub" id="resultSub"></div>
  <div class="result-actions">
    <button class="btn-close" onclick="closeR()">重新选牌</button>
    <button class="btn-save" onclick="dl()">📥 保存图片</button>
  </div>
</div>
<div class="footer">仅供娱乐参考 · 随缘而安 🌿</div>

<script>
const R = [["一切就绪只等你动.png", "一切就绪，只等你动", "行动,开始,机会,准备,项目"], ["一切都会过去.png", "一切都会过去", "低谷,痛苦,希望,坚持,安慰"], ["一切都是最好的安排.png", "一切都是最好的安排", "接受,命运,放下,挫折,感恩"], ["一步一步来.png", "一步一步来", "耐心,过程,踏实,成长,不急"], ["不破不立，破而后立.png", "不破不立，破而后立", "改变,突破,重建,转型,开始"], ["不要强留，该走的终会走.png", "不要强留，该走的终会走", "分手,失去,感情,放下,告别"], ["与其坐等，不如出发.png", "与其坐等，不如出发", "行动,等待,开始,主动,出发"], ["与其纠结，不如一试.png", "与其纠结，不如一试", "犹豫,试试,行动,决定,冒险"], ["今日之失，他日之得.png", "今日之失，他日之得", "失去,希望,挫折,未来,回报"], ["何必问人，问自己.png", "何必问人，问自己", "自我,内心,决定,选择,独立"], ["你心里已有答案.png", "你心里已有答案", "犹豫,自信,选择,内心,迷茫"], ["你担心的事，没那么可怕.png", "你担心的事，没那么可怕", "恐惧,焦虑,担心,考试,压力"], ["你有万钧之力，只是不自知.png", "你有万钧之力，只是不自知", "自信,力量,潜力,挑战,低估"], ["你比想象中更强.png", "你比想象中更强", "自信,恐惧,力量,挑战,勇敢"], ["再想想，别急着决定.png", "再想想，别急着决定", "犹豫,思考,谨慎,选择,投资"], ["别怕，你已经准备好了.png", "别怕，你已经准备好了", "自信,考试,面试,准备,勇敢"], ["别着急，让子弹飞一会儿.png", "别着急，让子弹飞一会儿", "等待,耐心,观察,结果,不急"], ["前路光明大步向前.png", "前路光明，大步向前", "事业,前途,信心,旅行,决定"], ["危机中藏着转机.png", "危机中藏着转机", "危机,转机,困难,逆境,机会"], ["吉人自有天相.png", "吉人自有天相", "运气,信心,保佑,考试,竞争"], ["听从本心，不问东西.png", "听从本心，不问东西", "内心,选择,自信,方向,热爱"], ["回头是岸.png", "回头是岸", "错误,改正,回头,悔改,觉悟"], ["塞翁失马，焉知非福.png", "塞翁失马，焉知非福", "得失,挫折,转机,命运,坏事"], ["天时地利人和已备.png", "天时地利，人和已备", "机遇,合作,婚姻,项目,谈判"], ["好事多磨，天自安排.png", "好事多磨，天自安排", "等待,困难,坚持,感情,命运"], ["就算了吧，别勉强了.png", "就算了吧，别勉强了", "放弃,勉强,感情,执念,释怀"], ["强求无益不如放下.png", "强求无益，不如放下", "感情,放下,放弃,释怀,分手"], ["待到春雨来，寸草自生.png", "待到春雨来，寸草自生", "等待,转机,希望,自然,成长"], ["得与失，看你怎么看.png", "得与失，看你怎么看", "得失,心态,角度,放下,看开"], ["心之所向行之不疑.png", "心之所向，行之不疑", "方向,选择,梦想,热爱,内心"], ["想多了，哪有那么复杂.png", "想多了，哪有那么复杂", "纠结,焦虑,简单,放下,不必"], ["握不住的沙，不如扬了它.png", "握不住的沙，不如扬了它", "放下,失去,放手,感情,执着"], ["改变从今天开始.png", "改变从今天开始", "改变,行动,开始,决心,拖延"], ["放下执念，豁然开朗.png", "放下执念，豁然开朗", "放下,感情,释怀,解脱,过去"], ["放手一搏自有天助.png", "放手一搏，自有天助", "创业,冒险,投资,勇气,突破"], ["时机已到当机立断.png", "时机已到，当机立断", "事业,工作,机会,行动,决定"], ["时机未到莫要强求.png", "时机未到，莫要强求", "等待,感情,耐心,转运,求职"], ["有缘无分，强求不来.png", "有缘无分，强求不来", "缘分,错过,感情,放下,遗憾"], ["欲速则不达.png", "欲速则不达", "急躁,耐心,事业,焦虑,等待"], ["此刻不宜后会有期.png", "此刻不宜，后会有期", "等待,推迟,感情,投资,暂缓"], ["此时可行不必由于.png", "此时可行，不必由于", "行动,决定,事业,试试,机会"], ["此路不通另有天地.png", "此路不通，另有天地", "放弃,转行,失败,转折,选择"], ["此非其时，静观其变.png", "此非其时，静观其变", "等待,耐心,观望,时机,不宜"], ["沉住气，好戏在后头.png", "沉住气，好戏在后头", "耐心,等待,低谷,转机,坚持"], ["没有绝对的好坏.png", "没有绝对的好坏", "对错,辩证,角度,判断,接受"], ["现在不行动，更待何时.png", "现在不行动，更待何时", "行动,拖延,时机,开始,立刻"], ["看似坏事，未必是坏事.png", "看似坏事，未必是坏事", "坏事,挫折,辩证,转机,心态"], ["答案不是知道的时候.png", "答案不是知道的时候", "未知,等待,时间,答案,领悟"], ["答案都在你心里.png", "答案都在你心里", "内心,迷茫,选择,自我,思考"], ["耐心是金，急则生乱.png", "耐心是金，急则生乱", "耐心,急躁,情绪,等待,决定"], ["船到桥头自然直.png", "船到桥头自然直", "放心,焦虑,未来,信任,等待"], ["该是你的跑不掉.png", "该是你的，跑不掉", "缘分,得失,机会,信任,等待"], ["该来的，终究会来.png", "该来的，终究会来", "等待,命运,缘分,结果,信心"], ["趁热打铁莫失良机.png", "趁热打铁，莫失良机", "时机,机会,行动,投资,抓紧"], ["路是走出来的.png", "路是走出来的", "行动,开始,探索,创业,前行"], ["过去的，就让它过去吧.png", "过去的，就让它过去吧", "过去,放下,分手,释怀,遗憾"], ["迈出第一步，路就开了.png", "迈出第一步，路就开了", "行动,开始,恐惧,突破,勇气"], ["退一步，海阔天空.png", "退一步，海阔天空", "冲突,争执,关系,包容,退让"], ["随它去吧.png", "随它去吧", "放下,释怀,随缘,放松,放手"], ["静待花开，莫急一时.png", "静待花开，莫急一时", "等待,耐心,感情,转运,成长"], ["顺其自然，万般皆是缘.png", "顺其自然，万般皆是缘", "感情,缘分,放下,随缘,命运"], ["风水轮流转，迟早轮到你.png", "风水轮流转，迟早轮到你", "运气,转机,机会,坚持,等待"]];
const ALL = R.map(([f,n,k],i)=>({id:i+1,file:f,name:n,kw:k.split(',')}));
const BACK = "卡牌背面.png";
let sel = null;

function isMobile(){return window.innerWidth < 768}

function match(q){
  if(!q.trim()) return ALL.slice(0);
  const ws = q.replace(/[，。！？、；：""''（）【】《》\s]/g,' ').split(' ').filter(Boolean);
  let sc = ALL.map(c=>{let s=0;for(let w of ws)for(let k of c.kw){if(k.includes(w)||w.includes(k)) s+=5;if(w===k) s+=3;}return{c,s};});
  sc.sort((a,b)=>b.s-a.s);
  let top = sc.filter(x=>x.s>0).map(x=>x.c);
  return top.length<6 ? ALL : top.slice(0,Math.min(15,Math.max(8,Math.ceil(top.length*0.3))));
}

function deal(){
  const cards = match(document.getElementById('qt').value);
  if(isMobile()) showSwipe(cards);
  else showFan(cards);
}

// === MOBILE: horizontal swipe ===
function showSwipe(cards){
  const area = document.getElementById('swipeArea');
  area.innerHTML = '';
  area.classList.add('show');
  document.getElementById('deckArea').style.opacity = '0.3';
  const n = Math.min(cards.length, 15);
  cards.slice(0,n).forEach((c,i)=>{
    const el = document.createElement('div');
    el.className = 'swipe-card';
    el.style.animationDelay = (i*0.04)+'s';
    el.innerHTML = '<img src="'+BACK+'" alt="'+c.name+'">';
    el.onclick = function(){pick(c);};
    area.appendChild(el);
  });
  // Enable touch swipe - native scroll with momentum
}

// === DESKTOP: fan ===
function showFan(cards){
  const O = document.getElementById('fanOverlay');
  const W = document.getElementById('fanWrap');
  W.innerHTML = '';
  O.classList.add('show');
  const n = Math.min(cards.length, 15);
  const cw = Math.min(90, (window.innerWidth-40)/n);
  const vw = window.innerWidth;
  const startAngle = -10, endAngle = 55;
  const fanR = Math.min(vw * 0.55, 300);
  for(let i=0;i<n;i++){
    const pct = n<=1 ? 0.5 : i/(n-1);
    const angle = startAngle + pct * (endAngle - startAngle);
    const rad = angle * Math.PI / 180;
    const cx = vw * 0.06 + Math.cos(rad) * fanR;
    const cy = 50 - Math.sin(rad) * fanR * 0.65 + 180;
    const el = document.createElement('div');
    el.className = 'fan-card';
    el.style.width = cw+'px'; el.style.height = (cw*1.5)+'px';
    el.style.left = cx+'px'; el.style.top = cy+'px';
    el.style.transform = 'rotate('+(angle+5)+'deg)';
    el.style.animationDelay = (i*0.04)+'s';
    el.innerHTML = '<img src="'+BACK+'" alt="'+cards[i].name+'">';
    el.onclick = function(){pick(cards[i]);};
    W.appendChild(el);
  }
}

function pick(c){
  sel = c;
  document.getElementById('swipeArea').classList.remove('show');
  document.getElementById('fanOverlay').classList.remove('show');
  document.getElementById('deckArea').style.opacity = '1';
  const rc = document.getElementById('resultCard');
  const img = document.createElement('img');
  img.src = c.file;
  img.onerror = function(){this.src = BACK; this.style.transform = 'scaleX(-1)';};
  img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
  rc.innerHTML = ''; rc.appendChild(img);
  const p = c.name.split('，');
  document.getElementById('resultText').textContent = p[0] || c.name;
  document.getElementById('resultSub').textContent = p.slice(1).join(' ') || '';
  document.getElementById('resultOverlay').classList.add('show');
}

function closeR(){document.getElementById('resultOverlay').classList.remove('show');}

function dl(){
  if(!sel||!sel.file){alert('暂无图片');return;}
  const a = document.createElement('a');
  a.href = sel.file;
  a.download = '答案之书_'+sel.name.replace(/[，,、\s]/g,'')+'.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

document.getElementById('dealBtn').onclick = deal;
document.getElementById('deckArea').onclick = deal;
</script>
</body>
</html>

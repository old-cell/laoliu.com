<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>答案之书 · 老六茶事</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei','Noto Serif SC',serif;background:#1a1a2e;color:#e2e8f0;min-height:100vh;overflow-x:hidden;user-select:none}
.header{text-align:center;padding:24px 20px 6px}
.header h1{font-size:24px;color:#d4af37;letter-spacing:6px;font-weight:700}
.header .sub{font-size:11px;color:#64748b;letter-spacing:3px;margin-top:3px}
.q-area{padding:6px 20px;max-width:400px;margin:0 auto}
.q-area textarea{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(212,175,55,0.25);background:rgba(30,41,59,0.8);color:#e2e8f0;font-size:14px;font-family:inherit;resize:none;outline:none;min-height:60px}
.q-area textarea:focus{border-color:#d4af37}
.q-area textarea::placeholder{color:#475569}
.btn-row{display:flex;gap:10px;margin-top:8px;justify-content:center}
.btn{padding:10px 28px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-pri{background:linear-gradient(135deg,#d4af37,#b8942e);color:#1a1a2e;box-shadow:0 2px 10px rgba(212,175,55,0.3)}
.deck-area{position:fixed;bottom:30px;left:20px;z-index:10;width:90px;height:135px;cursor:pointer}
.deck-area img{width:100%;height:100%;object-fit:cover;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.deck-glow{position:absolute;inset:-4px;border-radius:10px;background:radial-gradient(ellipse,rgba(212,175,55,0.2),transparent 70%);animation:glow 2s ease-in-out infinite;pointer-events:none}
@keyframes glow{0%,100%{opacity:0.5}50%{opacity:1}}
.deck-count{position:absolute;top:-8px;right:-8px;background:#d4af37;color:#1a1a2e;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px}
/* Mobile strip */
.m-strip{display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;padding:10px 0 18px;background:linear-gradient(transparent,rgba(0,0,0,0.85));overflow-x:scroll;-webkit-overflow-scrolling:touch;white-space:nowrap}
.m-strip.show{display:block}
.m-card{display:inline-block;width:72px;height:108px;border-radius:5px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,0.5);cursor:pointer;vertical-align:bottom}
.m-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.m-card:active{transform:scale(0.9);transition:transform 0.1s}
.m-card+.m-card{margin-left:6px}
.m-card:first-child{margin-left:12px}
.m-card:last-child{margin-right:12px}
.swipe-guide{display:none;position:fixed;bottom:145px;left:0;right:0;z-index:60;text-align:center;color:rgba(212,175,55,0.5);font-size:12px;letter-spacing:4px;animation:guidePulse 1.5s ease-in-out infinite;pointer-events:none}
.swipe-guide.show{display:block}
@keyframes guidePulse{0%,100%{opacity:0.3}50%{opacity:1}}
/* Desktop fan */
.fan-overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.7)}
.fan-overlay.show{display:block}
.fan-card{position:absolute;cursor:pointer;border-radius:6px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.5)}
.fan-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.fan-card{opacity:0}
.fan-card:hover{z-index:100!important;box-shadow:0 8px 30px rgba(212,175,55,0.4)!important}
@keyframes fanSwingIn{0%{opacity:0;transform:var(--start)}100%{opacity:1;transform:var(--end)}}
/* Floating pull-out card */
.floating-card{position:fixed;z-index:150;border-radius:8px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.6);pointer-events:none;transition:all 1.8s cubic-bezier(0.22,1,0.36,1)}
.floating-card img{width:100%;height:100%;object-fit:cover;display:block}
/* Result */
.result-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.85);justify-content:center;align-items:center;flex-direction:column}
.result-overlay.show{display:flex}
.result-card{width:290px;height:435px;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6);border:2px solid #d4af37;animation:fadeIn 1s both}
.result-card img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.result-text{margin-top:14px;color:#d4af37;font-size:20px;font-weight:700;letter-spacing:3px;text-align:center}
.result-sub{margin-top:2px;color:#94a3b8;font-size:13px;letter-spacing:1px}
.result-actions{display:flex;gap:10px;margin-top:16px}
.btn-close{padding:8px 20px;border-radius:8px;border:1px solid rgba(212,175,55,0.3);background:transparent;color:#94a3b8;font-size:13px;cursor:pointer;font-family:inherit}
.btn-save{padding:8px 20px;border-radius:8px;border:none;background:linear-gradient(135deg,#d4af37,#b8942e);color:#1a1a2e;font-size:13px;cursor:pointer;font-weight:600;font-family:inherit}
.footer{text-align:center;padding:14px 20px 180px;color:#475569;font-size:11px}
@media(min-width:768px){
  .m-strip{display:none!important}
  .swipe-guide{display:none!important}
  .deck-area{width:100px;height:150px}
}
</style>
</head>
<body>
<div class="header">
  <h1>答 案 之 书</h1>
  <div class="sub">— 老六茶事 · 塔罗占卜 —</div>
</div>
<div class="q-area">
  <textarea id="qt" placeholder="心里默念你的问题…"></textarea>
  <div class="btn-row"><button class="btn btn-pri" id="dealBtn">🎴 翻牌</button></div>
</div>
<div class="deck-area" id="deckArea">
  <div class="deck-glow"></div>
  <img src="卡牌背面.png" alt="">
  <div class="deck-count" id="deckCount" style="display:none">0</div>
</div>
<div class="swipe-guide" id="swipeGuide">— 左右滑动选择 —</div>
<div class="m-strip" id="mStrip"></div>
<div class="fan-overlay" id="fanOverlay"></div>
<div class="result-overlay" id="resultOverlay">
  <div class="result-card" id="resultCard"></div>
  <div class="result-text" id="resultText"></div>
  <div class="result-sub" id="resultSub"></div>
  <div class="result-actions">
    <button class="btn-close" onclick="cl()">重新选牌</button>
    <button class="btn-save" onclick="dl()">📥 保存</button>
  </div>
</div>
<div class="footer">仅供娱乐参考 · 随缘而安 🌿</div>

<script>
var R = [["一切就绪只等你动.png", "一切就绪，只等你动", "行动,开始,机会,准备,项目"], ["一切都会过去.png", "一切都会过去", "低谷,痛苦,希望,坚持,安慰"], ["一切都是最好的安排.png", "一切都是最好的安排", "接受,命运,放下,挫折,感恩"], ["一步一步来.png", "一步一步来", "耐心,过程,踏实,成长,不急"], ["不破不立，破而后立.png", "不破不立，破而后立", "改变,突破,重建,转型,开始"], ["不要强留，该走的终会走.png", "不要强留，该走的终会走", "分手,失去,感情,放下,告别"], ["与其坐等，不如出发.png", "与其坐等，不如出发", "行动,等待,开始,主动,出发"], ["与其纠结，不如一试.png", "与其纠结，不如一试", "犹豫,试试,行动,决定,冒险"], ["今日之失，他日之得.png", "今日之失，他日之得", "失去,希望,挫折,未来,回报"], ["何必问人，问自己.png", "何必问人，问自己", "自我,内心,决定,选择,独立"], ["你心里已有答案.png", "你心里已有答案", "犹豫,自信,选择,内心,迷茫"], ["你担心的事，没那么可怕.png", "你担心的事，没那么可怕", "恐惧,焦虑,担心,考试,压力"], ["你有万钧之力，只是不自知.png", "你有万钧之力，只是不自知", "自信,力量,潜力,挑战,低估"], ["你比想象中更强.png", "你比想象中更强", "自信,恐惧,力量,挑战,勇敢"], ["再想想，别急着决定.png", "再想想，别急着决定", "犹豫,思考,谨慎,选择,投资"], ["别怕，你已经准备好了.png", "别怕，你已经准备好了", "自信,考试,面试,准备,勇敢"], ["别着急，让子弹飞一会儿.png", "别着急，让子弹飞一会儿", "等待,耐心,观察,结果,不急"], ["前路光明大步向前.png", "前路光明，大步向前", "事业,前途,信心,旅行,决定"], ["危机中藏着转机.png", "危机中藏着转机", "危机,转机,困难,逆境,机会"], ["吉人自有天相.png", "吉人自有天相", "运气,信心,保佑,考试,竞争"], ["听从本心，不问东西.png", "听从本心，不问东西", "内心,选择,自信,方向,热爱"], ["回头是岸.png", "回头是岸", "错误,改正,回头,悔改,觉悟"], ["塞翁失马，焉知非福.png", "塞翁失马，焉知非福", "得失,挫折,转机,命运,坏事"], ["天时地利人和已备.png", "天时地利，人和已备", "机遇,合作,婚姻,项目,谈判"], ["好事多磨，天自安排.png", "好事多磨，天自安排", "等待,困难,坚持,感情,命运"], ["就算了吧，别勉强了.png", "就算了吧，别勉强了", "放弃,勉强,感情,执念,释怀"], ["强求无益不如放下.png", "强求无益，不如放下", "感情,放下,放弃,释怀,分手"], ["待到春雨来，寸草自生.png", "待到春雨来，寸草自生", "等待,转机,希望,自然,成长"], ["得与失，看你怎么看.png", "得与失，看你怎么看", "得失,心态,角度,放下,看开"], ["心之所向行之不疑.png", "心之所向，行之不疑", "方向,选择,梦想,热爱,内心"], ["想多了，哪有那么复杂.png", "想多了，哪有那么复杂", "纠结,焦虑,简单,放下,不必"], ["握不住的沙，不如扬了它.png", "握不住的沙，不如扬了它", "放下,失去,放手,感情,执着"], ["改变从今天开始.png", "改变从今天开始", "改变,行动,开始,决心,拖延"], ["放下执念，豁然开朗.png", "放下执念，豁然开朗", "放下,感情,释怀,解脱,过去"], ["放手一搏自有天助.png", "放手一搏，自有天助", "创业,冒险,投资,勇气,突破"], ["时机已到当机立断.png", "时机已到，当机立断", "事业,工作,机会,行动,决定"], ["时机未到莫要强求.png", "时机未到，莫要强求", "等待,感情,耐心,转运,求职"], ["有缘无分，强求不来.png", "有缘无分，强求不来", "缘分,错过,感情,放下,遗憾"], ["欲速则不达.png", "欲速则不达", "急躁,耐心,事业,焦虑,等待"], ["此刻不宜后会有期.png", "此刻不宜，后会有期", "等待,推迟,感情,投资,暂缓"], ["此时可行不必由于.png", "此时可行，不必由于", "行动,决定,事业,试试,机会"], ["此路不通另有天地.png", "此路不通，另有天地", "放弃,转行,失败,转折,选择"], ["此非其时，静观其变.png", "此非其时，静观其变", "等待,耐心,观望,时机,不宜"], ["沉住气，好戏在后头.png", "沉住气，好戏在后头", "耐心,等待,低谷,转机,坚持"], ["没有绝对的好坏.png", "没有绝对的好坏", "对错,辩证,角度,判断,接受"], ["现在不行动，更待何时.png", "现在不行动，更待何时", "行动,拖延,时机,开始,立刻"], ["看似坏事，未必是坏事.png", "看似坏事，未必是坏事", "坏事,挫折,辩证,转机,心态"], ["答案不是知道的时候.png", "答案不是知道的时候", "未知,等待,时间,答案,领悟"], ["答案都在你心里.png", "答案都在你心里", "内心,迷茫,选择,自我,思考"], ["耐心是金，急则生乱.png", "耐心是金，急则生乱", "耐心,急躁,情绪,等待,决定"], ["船到桥头自然直.png", "船到桥头自然直", "放心,焦虑,未来,信任,等待"], ["该是你的跑不掉.png", "该是你的，跑不掉", "缘分,得失,机会,信任,等待"], ["该来的，终究会来.png", "该来的，终究会来", "等待,命运,缘分,结果,信心"], ["趁热打铁莫失良机.png", "趁热打铁，莫失良机", "时机,机会,行动,投资,抓紧"], ["路是走出来的.png", "路是走出来的", "行动,开始,探索,创业,前行"], ["过去的，就让它过去吧.png", "过去的，就让它过去吧", "过去,放下,分手,释怀,遗憾"], ["迈出第一步，路就开了.png", "迈出第一步，路就开了", "行动,开始,恐惧,突破,勇气"], ["退一步，海阔天空.png", "退一步，海阔天空", "冲突,争执,关系,包容,退让"], ["随它去吧.png", "随它去吧", "放下,释怀,随缘,放松,放手"], ["静待花开，莫急一时.png", "静待花开，莫急一时", "等待,耐心,感情,转运,成长"], ["顺其自然，万般皆是缘.png", "顺其自然，万般皆是缘", "感情,缘分,放下,随缘,命运"], ["风水轮流转，迟早轮到你.png", "风水轮流转，迟早轮到你", "运气,转机,机会,坚持,等待"]];

var ALL = R.map(function(a,i){return{id:i+1,file:a[0],name:a[1],kw:a[2].split(',')}});
var B = "卡牌背面.png";
var sel = null;
(new Image()).src = B;

function match(q){
  if(!q.trim()) return ALL;
  var w = q.replace(/[，。！？、；：""''（）【】《》\s]/g,' ').split(' ').filter(function(x){return x});
  var s = ALL.map(function(c){
    var sc = 0;
    for(var a=0;a<w.length;a++) for(var b=0;b<c.kw.length;b++){
      if(c.kw[b].indexOf(w[a])>=0||w[a].indexOf(c.kw[b])>=0) sc+=5;
      if(w[a]===c.kw[b]) sc+=3;
    }
    return {c:c,s:sc};
  });
  s.sort(function(a,b){return b.s-a.s});
  var t = s.filter(function(x){return x.s>0}).map(function(x){return x.c});
  return t.length<6?ALL:t.slice(0,Math.min(15,Math.max(8,Math.ceil(t.length*0.3))));
}

function deal(){
  var cards = match(document.getElementById('qt').value);
  if(window.innerWidth<768) showMobile(cards);
  else showDesktop(cards);
  document.getElementById('deckArea').style.opacity='0.3';
}

// === MOBILE ===
function showMobile(cards){
  var strip = document.getElementById('mStrip');
  strip.innerHTML = '';
  strip.className = 'm-strip show';
  var guide = document.getElementById('swipeGuide');
  guide.className = 'swipe-guide show';
  var n = Math.min(cards.length, 20);
  var frag = document.createDocumentFragment();
  for(var i=0;i<n;i++){
    var el = document.createElement('div');
    el.className = 'm-card';
    var img = document.createElement('img');
    img.src = B; img.alt = cards[i].name;
    el.appendChild(img);
    el.onclick = (function(c){return function(e){guide.className='swipe-guide';pullFrom(e,c);}})(cards[i]);
    frag.appendChild(el);
  }
  strip.appendChild(frag);
  strip.onscroll = function(){guide.className='swipe-guide';};
  requestAnimationFrame(function(){strip.scrollLeft=0;});
}

// === DESKTOP: true fan from shared pivot point ===
function showDesktop(cards){
  var O = document.getElementById('fanOverlay');
  O.innerHTML = '';
  O.className = 'fan-overlay show';
  var n = cards.length;
  var vw = window.innerWidth, vh = window.innerHeight;
  var cw = 100, ch = 150;
  // All cards share this pivot point (the fan center)
  var px = vw/2;
  var py = vh - 60;
  // Classic fan: position all cards at same point, rotate around bottom-center
  var angleSpan = 100;
  var frag = document.createDocumentFragment();
  
  for(var i=0;i<n;i++){
    var pct = n<=1?0.5:i/(n-1);
    var angle = angleSpan/2 - pct * angleSpan;
    var el = document.createElement('div');
    el.className = 'fan-card';
    el.style.left = (px - cw/2)+'px';
    el.style.top = (py - ch)+'px';
    el.style.width = cw+'px';
    el.style.height = ch+'px';
    // Rotate around bottom-center → all cards converge at pivot
    el.style.opacity = '0';
    var startRot = angle + (angle>0?30:-30);
    el.style.setProperty('--start', 'rotate('+startRot+'deg) translateY(-'+vh*0.95+'px)');
    el.style.setProperty('--end', 'rotate('+angle+'deg) translateY(-'+vh*0.75+'px)');
    el.style.animation = 'fanSwingIn 0.8s cubic-bezier(0.33,1,0.68,1) '+ (i*0.08) +'s both';
    el.style.transform = 'rotate('+angle+'deg) translateY(-'+vh*0.75+'px)';
    el.style.transformOrigin = 'center bottom';
    var img = document.createElement('img');
    img.src = B; img.alt = cards[i].name;
    el.appendChild(img);
    el.onclick = (function(c,e){return function(ev){fanPull(ev,c,e);}})(cards[i],el);
    frag.appendChild(el);
  }
  O.appendChild(frag);
}

// === PULL-OUT ===
function pullFrom(e,card){
  sel = card;
  var rect = e.currentTarget.getBoundingClientRect();
  doPull(rect, card);
  document.getElementById('mStrip').className='m-strip';
  document.getElementById('fanOverlay').className='fan-overlay';
  document.getElementById('swipeGuide').className='swipe-guide';
}
function fanPull(e,card,el){
  sel = card;
  doPull(el.getBoundingClientRect(), card);
  document.getElementById('fanOverlay').className='fan-overlay';
}
function doPull(rect, card){
  var vw = window.innerWidth, vh = window.innerHeight;
  var cw = rect.width, ch = rect.height;
  var cx = rect.left + cw/2, cy = rect.top + ch/2;
  var fc = document.createElement('div');
  fc.className = 'floating-card';
  fc.style.width = cw+'px'; fc.style.height = ch+'px';
  fc.style.left = (cx-cw/2)+'px'; fc.style.top = (cy-ch/2)+'px';
  fc.style.transform = 'rotateY(0deg)';
  fc.innerHTML = '<img src="'+B+'">';
  document.body.appendChild(fc);
  fc.offsetHeight;
  var tW = Math.min(290, vw*0.8), tH = tW*1.5;
  fc.style.width = tW+'px'; fc.style.height = tH+'px';
  fc.style.left = (vw-tW)/2+'px'; fc.style.top = (vh-tH)/2+'px';
  fc.style.transform = 'rotateY(720deg)';
  fc.style.boxShadow = '0 20px 60px rgba(0,0,0,0.6)';
  setTimeout(function(){
    fc.innerHTML = '<img src="'+card.file+'">';
    setTimeout(function(){
      document.body.removeChild(fc);
      showResult(card);
    },600);
  },1800);
}
function showResult(card){
  sel = card;
  document.getElementById('deckArea').style.opacity='1';
  var img=document.createElement('img');
  img.src=card.file;
  img.onerror=function(){this.src=B;this.style.transform='scaleX(-1)';};
  img.style.cssText='width:100%;height:100%;object-fit:cover;display:block';
  document.getElementById('resultCard').innerHTML=''; document.getElementById('resultCard').appendChild(img);
  var p=card.name.split('，');
  document.getElementById('resultText').textContent=p[0]||card.name;
  document.getElementById('resultSub').textContent=p.slice(1).join(' ')||'';
  document.getElementById('resultOverlay').className='result-overlay show';
}
function cl(){document.getElementById('resultOverlay').className='result-overlay'}
function dl(){
  if(!sel||!sel.file)return;
  var a=document.createElement('a');
  a.href=sel.file; a.download='答案之书_'+sel.name.replace(/[，,、\s]/g,'')+'.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
document.getElementById('dealBtn').onclick=deal;
document.getElementById('deckArea').onclick=deal;
</script>
</body>
</html>

  {title: '书的结构与解字', content: `<div class="article-title">梅花易数小白快速入门教程（二）</div>
    <div style="text-align:center;margin:16px 0;"><img src="/images/jc-02-02-书的结构与解字.jpg" alt="书的结构与解字的文章配图" style="max-width:100%;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1);"></div>

    <p>上一期我们聊了《梅花易数》这本书的概况。今天咱们来说说这本书的结构，特别是一个很多人都会忽略的问题——为什么前半本讲起卦解卦，后半本突然画风一变，开始讲起了"解字"？</p>

    <h2>一、这本书，只看前半本就够了？</h2>

    <p>如果你看过这个案例就知道，故事是这样的：邵雍某天在花园里看到两只麻雀争枝，掉到地上，于是起了一卦，推断第二天会有少女来折花，园丁追赶，少女受惊摔倒，伤了大腿。</p>

    <p>结果——全中。</p>

    <p>但是问题来了：<strong>他怎么知道"兑卦"就一定代表"少女"？</strong></p>

    <p>你可能觉得这有什么好问的，卦书上不写了吗？兑为少女啊！但你细想一下：兑卦的意象非常多，可以是泽、是口、是羊、是缺、是毁折……为什么偏偏在"梅花占"这个案例里，就选"少女"这个意象？</p>

    <p>这就是争论的焦点了。</p>

    <p>有一种说法很有意思，咱们一起来看看——</p>

    <p>梅花占是从"观两雀相争坠地"起的卦，那"雀"字是什么意思？拆开来看，"雀"字上面一个"小"，下面一个"隹"（短尾鸟）。但你要是往深了拆解，"雀"可以看作"少"+"佳"——<strong>"少"就是年少，"佳"就是佳人</strong>。连起来就是"少女佳人"的意思。</p>

<h2>太极、两仪、四象、八卦——符号背后的易理</h2>

<h2>一、太极</h2>

<p>首先要说的是<strong>太极</strong>。如今有很多人在研究"太极点"的问题，也有人试图将其与现代科学联系起来，认为太极就是宇宙大爆炸之前的初始形态。但不管哪种说法，最令人信服的还是<strong>伏羲一画开天地</strong>的传说。</p>

<p>说白了，太极就是伏羲在思索宇宙空间、阴阳尚未分化之前的一种存在状态。在远古那个没有文字的时代，伏羲用简单的一横来表示它——甚至可能只是随手捡起的一根木棍。因为在那个年代，别说文字了，连符号的概念都还没有。所以有易学研究者提出，太极最初可能真的就是一根木棍，后来为了方便记忆才演变成符号——一横。这一横，极其形象地表达了太极的涵义。</p>

<p>这便是<strong>"太极生两仪"</strong>。而且值得注意的是，阴中有阳，阳中有阴——断裂的两截合在一起还是一，一分为二便是二。这个解释虽然有些牵强，但作为现代人的一种脑洞，了解一下也无妨，至少有助于记忆。</p>

<div class="highlight-box">

<h3>少阳</h3>
<p>早上，太阳刚升起时又红又大，感觉有些热，但地面却是清冷的。上天下地，冷暖不同，古人用<strong>上面一个阳爻、下面一个阴爻</strong>来表示这种现象，称之为<strong>少阳</strong>（⚎）。</p>

<h3>太阳</h3>

<h2>三、形象记忆法</h2>

<h3>相生记忆</h3>
<p>溪水从山上流出，山为石、代表金，所以<strong>金生水</strong>；水流两侧滋养树木，所以<strong>水生木</strong>；伐木生火，<strong>木生火</strong>这个好理解；火烧木成灰滋养土地，或者大火所焚烧过的灰烬时间久了便化为土，<strong>火生土</strong>；土地里常常有结块而成的石头，<strong>土生金</strong>。</p>

<h3>相克记忆</h3>
<p>石头阻碍树木根系伸展，<strong>金克木</strong>；树木防止水土流失，<strong>木克土</strong>；水来土掩，<strong>土克水</strong>；<strong>水克火</strong>很好理解；大火可以焚烧石头成土，<strong>火克金</strong>。</p>

<h2>五、军队作战比喻（帮你彻底理解）</h2>

<p>对于生克的理解，小编经常以<strong>军队作战</strong>来比喻，这样比较好理解。</p>

<div class="battle-box">
    <p><span class="battle-label">⚔️ 场景设定：</span>A 军代表你自己，B 军代表敌军。</p>
</div>

<h3>▸ 克出 → 大吉：「我方获胜，但也有代价」</h3>
<p>好比 A、B 两支军队作战，最终 A 军大获全胜。切记：虽然你最终赢得了胜利，但你自己也是有代价、有伤亡的。</p>

<h3>▸ 被克 → 大凶：「我方被压制，处处被动」</h3>
<p>A 军被 B 军围攻压制，节节败退，损失惨重，此为最不利的局势。</p>

<h3>▸ 生入 → 小吉：「援军到来，实力增强」</h3>
<p>B 军中有一部分士兵投降、投奔到 A 军，壮大了 A 军的实力，削弱了敌军的力量。不战而屈人之兵，虽非全胜，但已获利。</p>

<h3>▸ 生出 → 小凶：「兵力外调，实力削弱」</h3>
<p>两军对峙，A 军的一部分人叛逃到对方那里，壮大了对方的实力，而减弱了你自己的实力。</p>

    <p>克出（我克他）→ <span style="color:#1a7a3a;font-weight:600;">大吉</span>，但需付出代价</p>
    <p>生入（他生我）→ <span style="color:#1a7a3a;font-weight:600;">小吉</span>，有人相助</p>
    <p>生出（我生他）→ <span style="color:#b22222;font-weight:600;">小凶</span>，自身损耗</p>
    <p>被克（他克我）→ <span style="color:#b22222;font-weight:600;">大凶</span>，处处受制</p>

    <p>这套序数就是起卦时取地支数字的依据。比如 <span class="highlight">子</span> 为 1，<span class="highlight">丑</span> 为 2，依此类推。</p>

    <p>干支纪年由十天干（甲、乙、丙、丁、戊、己、庚、辛、壬、癸）和十二地支组合而成，六十年一循环。一般可以查阅万年历获得。例如：2026 年是 <span class="highlight">丙午年</span>，其中地支为"午"，对应序数 <strong>7</strong>。</p>

    <div class="tip-box">
        <strong>💡 提示：</strong>立春是一年的分界点。如果起卦时间在当年立春之前，年份仍按上一年的干支计算。

        <strong>👆 食指：</strong>申9（指尖）→ 酉10 → 戌11 → 亥12

    <p>正常情况下，我们需要先把十二地支背下来，再去对应时间。但用了这个手指定位法，你其实根本不用死记硬背十二地支的顺序——<span class="highlight">只要找到对应时辰在哪个指节上，然后沿着手指依次往下数，就能快速得出序数</span>。</p>

<h1>📜 梅花易数教程（七）：起卦示例</h1>

<p>梅花易数起卦方式多种多样，简单方便。大体可以分为<strong>先天起卦</strong>和<strong>后天起卦</strong>两大类。</p>

<p>先天起卦以体用生克为主、爻辞卦辞为辅；后天起卦则反过来，以《易经》的卦辞爻辞为主体，体用生克则为辅助。这里先以<strong>先天起卦</strong>举例说明。</p>

<p>最常见的起卦方法就是报数字、用日期、捻米……倘若感觉这些方式都不太方便你当时所处的环境，还可以测字、数树叶，或者数数小石头，都是可以的。</p>

<p>下面我们用一个完整的实例，一步步展示从问事到成卦的全过程。</p>

<hr>

<h2>📌 实例：问工作室创业发展</h2>

<div class="note"><strong>问题：</strong>倘若自己开工作室创业，发展会是如何？</div>

<h2>📐 第一步：确定起卦数据</h2>

<p>以<strong>日期时辰</strong>起卦。假设问事时间为：</p>

<div class="calc"><strong>丙午年（2026年） 正月 三十 午时</strong></div>

<p>将年、月、日、时转换为数字（梅花易数中，地支序号即为其数字）：</p>

<table>
  <tr><th>项目</th><th>地支</th><th>数字</th></tr>
  <tr><td>年</td><td>丙午年 → 地支午</td><td><strong>7</strong></td></tr>
  <tr><td>月</td><td>正月</td><td><strong>1</strong></td></tr>
  <tr><td>日</td><td>三十</td><td><strong>30</strong></td></tr>
  <tr><td>时</td><td>午时 → 地支午</td><td><strong>7</strong></td></tr>
</table>

<div class="calc">年7 + 月1 + 日30 + 时7</div>

<hr>

<h2>🔢 第二步：求上卦</h2>

<p>用<strong>年 + 月 + 日</strong>之和除以8，取余数定上卦：</p>

<div class="calc">(7 + 1 + 30) ÷ 8 = 38 ÷ 8 = 4 余 <strong>6</strong>
余数 6 → <strong>坎卦 ☵（水）</strong></div>

<table>
  <tr><th>余数</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>0（8）</th></tr>
  <tr><th>卦</th><td>乾☰</td><td>兑☱</td><td>离☲</td><td>震☳</td><td>巽☴</td><td>坎☵</td><td>艮☶</td><td>坤☷</td></tr>
</table>

<p>上卦为 <strong>坎 ☵</strong>，属水。</p>

<hr>

<h2>🔢 第三步：求下卦</h2>

<p>用<strong>年 + 月 + 日 + 时</strong>之和除以8，取余数定下卦：</p>

<div class="calc">(7 + 1 + 30 + 7) ÷ 8 = 45 ÷ 8 = 5 余 <strong>5</strong>
余数 5 → <strong>巽卦 ☴（风）</strong></div>

<p>下卦为 <strong>巽 ☴</strong>，属木。</p>

<hr>

<h2>🔢 第四步：求动爻</h2>

<p>用<strong>年 + 月 + 日 + 时</strong>之和除以6，取余数定动爻（余数为0则动第6爻）：</p>

<div class="calc">(7 + 1 + 30 + 7) ÷ 6 = 45 ÷ 6 = 7 余 <strong>3</strong>
余数 3 → <strong>第三爻动</strong></div>

<p><strong>动爻为第三爻</strong>（从下往上数，初爻为第一爻）。</p>

<hr>

<h2>🏛️ 第五步：列出主卦（本卦）</h2>

<p>上卦为坎 ☵，下卦为巽 ☴，组成主卦：</p>

<div class="hexagram-box">
  <div class="hexagram">
    <div class="name">䷯ <strong>水风井</strong>（主卦）</div>
    <div class="lines">
      ⚋ 上六<br>
      ⚊ 九五<br>
      ⚋ 六四<br>

      ⚊ 九二<br>
      ⚋ 初六
    </div>
    <div class="desc">上坎☵下巽☴ · 水风井</div>
  </div>
</div>

<p>第三爻为阳爻（九三），是动爻。有动爻的卦即为<strong>用卦</strong>（巽 ☴），无动爻的卦为<strong>体卦</strong>（坎 ☵）。</p>

<div class="note"><strong>体用关系：</strong>体卦为坎水，用卦为巽木。水生木，<strong>体生用</strong>——主劳心费力、有付出之象，但根基稳固。</div>

<h2>🔄 第六步：求互卦</h2>

  <li><strong>上互卦</strong>：取主卦的第3、4、5爻（九三、六四、九五）组成上卦</li>

<h2>🔄 第七步：求变卦</h2>

<p>将主卦的动爻（第三爻）由阳爻变为阴爻，其余各爻不变，得到<strong>变卦</strong>，代表事物发展的<strong>最终结果</strong>：</p>

<h2>💡 附：起卦方法补充</h2>

<p>除了日期时辰起卦，梅花易数还有以下几种常见起卦方式：</p>

<ul>
  <li><strong>报数起卦：</strong>心中默念问题，随意报出两个或三个数字，以前者定上卦、次者定下卦（第三数定动爻）</li>
  <li><strong>捻米/数豆：</strong>随手抓一把米或豆子，数出粒数，用来计算卦象</li>
  <li><strong>测字起卦：</strong>任意写一个字，按笔画数或字形结构分拆定卦</li>

function renderChapter(idx) {
  const body = document.getElementById('bookBody');
  body.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'chapter-content';
  div.innerHTML = CHAPTERS[idx].content;
  body.appendChild(div);
  document.querySelectorAll('.chapter-item').forEach((el, i) => el.classList.toggle('active', i === idx));
  document.querySelectorAll('.mc-item').forEach((el, i) => el.classList.toggle('active', i === idx));
  document.querySelector('.content').scrollTop = 0;
}

function initBook() {
  const list = document.getElementById('chapterList');
  let groupDiv = document.createElement('div'); groupDiv.className = 'chapter-group';
  let title = document.createElement('div'); title.className = 'chapter-group-title'; title.textContent = '教程';
  groupDiv.appendChild(title);
  CHAPTERS.forEach((ch, i) => {
    const idx = i;
    const item = document.createElement('div'); item.className = 'chapter-item';
    item.innerHTML = `<span style="min-width:24px;color:rgba(212,175,55,0.4)">${i+1}</span>${ch.title}`;
    item.onclick = () => renderChapter(idx);
    groupDiv.appendChild(item);
  });
  list.appendChild(groupDiv);
  
  // Populate mobile chapter list
  const mcList = document.getElementById('mcList');
  if (mcList) {
    CHAPTERS.forEach((ch, i) => {
      const item = document.createElement('div'); item.className = 'mc-item';

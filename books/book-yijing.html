<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易经·周易 - 老六茶事藏书阁</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --green-deep: #1a3c2a; --green-mid: #2d5a3e;
  --gold: #d4af37; --gold-light: #f5e6b8; --gold-pale: #faf3e0;
  --bg: #efe4d0; --card: #ffffff;
  --text: #2c2c2c; --text-light: #666;
  --sidebar-w: 300px;
}
body {
  font-family: "Noto Serif SC", "Source Han Serif CN", "STSong", "SimSun", serif;
  background: var(--bg); color: var(--text);
  display: flex; min-height: 100vh;
}

/* Sidebar - wider for chapter list */
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: linear-gradient(180deg, var(--green-deep) 0%, #0f2b1e 100%);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: hidden;
}
.sidebar-header {
  padding: 28px 20px; text-align: center;
  border-bottom: 1px solid rgba(212,175,55,0.2);
}
.sidebar-header h2 {
  font-size: 22px; font-weight: 700; letter-spacing: 4px;
  background: linear-gradient(135deg, var(--gold), #e8c840, var(--gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.sidebar-header .sub { font-size: 12px; color: rgba(212,175,55,0.5); margin-top: 4px; letter-spacing: 2px; }
.back-link {
  display: block; padding: 12px 20px; color: var(--gold); font-size: 14px;
  text-decoration: none; cursor: pointer; border-bottom: 1px solid rgba(212,175,55,0.1);
}
.back-link:hover { background: rgba(212,175,55,0.12); }
/* Mobile chapter nav - hidden on desktop */
.mobile-chapter-nav { display: none; }
.chapter-list {
  flex: 1; overflow-y: auto; padding: 8px 0;
}
.chapter-list::-webkit-scrollbar { width: 4px; }
.chapter-list::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }
.chapter-group { padding: 6px 0; }
.chapter-group-title {
  padding: 8px 20px; font-size: 12px; color: rgba(212,175,55,0.55);
  letter-spacing: 2px; font-weight: 600;
}
.chapter-item {
  padding: 9px 20px 9px 28px; cursor: pointer; font-size: 14px;
  color: rgba(255,255,255,0.7); transition: all 0.25s;
  display: flex; align-items: center; gap: 8px;
}
.chapter-item:hover { background: rgba(212,175,55,0.1); color: var(--gold); padding-left: 32px; }
.chapter-item.active {
  background: rgba(212,175,55,0.15); color: var(--gold); font-weight: 600;
  border-left: 3px solid var(--gold);
}
.chapter-item .ci-num { font-size: 11px; color: rgba(212,175,55,0.35); min-width: 30px; }

/* Content - full viewport height */
.content {
  flex: 1; padding: 0; overflow-y: auto; height: 100vh;
}
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 6px; }

/* Book header - compact, less obtrusive */
.book-header {
  text-align: center; padding: 40px 20px 24px;
  border-bottom: 2px solid var(--gold); margin: 0 40px 0;
}
.book-header h1 {
  font-size: 28px; color: var(--green-deep); letter-spacing: 8px; margin-bottom: 6px;
  font-weight: 700;
}
.book-header .book-sub {
  font-size: 13px; color: var(--text-light); letter-spacing: 3px;
}

/* Hexagram card - full viewport, centered */
.hexagram-card {
  min-height: calc(100vh - 120px);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center;
  padding: 40px 40px 60px;
  max-width: 860px; margin: 0 auto;
}
.hexagram-card .hc-svg-row {
  display: flex; align-items: center; gap: 40px; margin-bottom: 32px;
}
.hexagram-svg {
  flex-shrink: 0; width: 260px; height: 380px;
  background: linear-gradient(135deg, #faf6ef, #f5efe4);
  border-radius: 14px; border: 2px solid #d4af37;
  padding: 24px 30px; box-shadow: 0 6px 36px rgba(26,60,42,0.15);
}
.hexagram-svg svg { width: 100%; height: 100%; display: block; }
.hexagram-card .hc-title-group { }
.hexagram-card .hc-name {
  font-size: 48px; font-weight: 700; color: var(--green-deep);
  letter-spacing: 4px; display: block;
}
.hexagram-card .hc-structure {
  font-size: 18px; color: var(--text-light); margin-top: 6px; display: block;
  letter-spacing: 2px;
}
.hexagram-card .hc-judgment {
  font-size: 22px; line-height: 1.8; margin-bottom: 24px;
  color: #c0392b; font-weight: 700; text-align: center;
  max-width: 700px; letter-spacing: 1px;
}
.hexagram-card .hc-divider {
  width: 60%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 0 auto 24px;
}
.hexagram-card .hc-lines {
  width: 100%; max-width: 620px;
  font-size: 17px; line-height: 2.2; color: var(--text);
}
.hexagram-card .hc-lines .line {
  padding: 3px 0; display: flex; align-items: baseline;
  border-bottom: 1px solid #f0ebe3;
}
.hexagram-card .hc-lines .line:last-child { border-bottom: none; }
.hexagram-card .hc-lines .line .ln-name {
  color: var(--green-deep); font-weight: 700; min-width: 60px;
  font-size: 15px;
}
.hexagram-card .hc-commentary {
  margin-top: 20px; padding: 16px 24px;
  border-top: 1px dashed #d4af37; width: 100%; max-width: 700px;
  font-size: 16px; line-height: 1.9; color: #555;
  background: #faf8f4; border-radius: 8px;
}
.hexagram-card .hc-commentary .cm-label {
  color: var(--gold); font-weight: 700; font-size: 14px;
}

/* Commentary section */
.commentary-section {
  min-height: calc(100vh - 120px);
  padding: 60px 40px; max-width: 820px; margin: 0 auto;
}
.commentary-section h3 {
  font-size: 22px; color: var(--green-deep); margin-bottom: 20px;
  text-align: center; letter-spacing: 4px;
  border-bottom: 2px solid var(--gold); padding-bottom: 12px;
}
.commentary-section p {
  font-size: 17px; line-height: 2.1; text-indent: 2em;
  margin-bottom: 14px; color: #444;
}

/* Mobile */
@media (max-width: 767px) {
  .sidebar { display: none; }
  .hexagram-card { padding: 20px 16px 40px; }
  .hexagram-card .hc-svg-row { flex-direction: column; gap: 16px; }
  .hexagram-svg { width: 120px; height: 173px; padding: 10px 14px; }
  .hexagram-card .hc-name { font-size: 32px; text-align: center; }
  .hexagram-card .hc-structure { text-align: center; }
  .hexagram-card .hc-judgment { font-size: 17px; }
  .hexagram-card .hc-lines { font-size: 14px; }
  .hexagram-card .hc-commentary { font-size: 14px; padding: 12px 16px; }
  .book-header { margin: 0 16px; }
  .book-header h1 { font-size: 22px; }
  .commentary-section { padding: 30px 16px; }
  .commentary-section p { font-size: 14px; }

  /* Mobile chapter nav */
  .mobile-chapter-nav { display: block; margin: 0 16px 16px; }
  .mc-toggle {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 12px 16px;
    background: var(--green-deep); color: var(--gold);
    border: none; border-radius: 8px; font-size: 15px;
    cursor: pointer; font-weight: 600; letter-spacing: 1px;
  }
  .mc-toggle .mc-arrow { transition: transform 0.3s; font-size: 12px; }
  .mc-toggle.open .mc-arrow { transform: rotate(180deg); }
  .mc-list { display: none; max-height: 50vh; overflow-y: auto; background: #fff; border-radius: 0 0 8px 8px; border: 1px solid #e0d8cc; border-top: none; }
  .mc-list.open { display: block; }
  .mc-item {
    padding: 10px 16px; font-size: 14px; color: var(--text);
    border-bottom: 1px solid #f0ebe3; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .mc-item:last-child { border-bottom: none; }
  .mc-item:hover { background: #faf3e0; }
  .mc-item.active { background: #faf3e0; color: var(--green-deep); font-weight: 600; border-left: 3px solid var(--gold); }
  .mc-item .mi-num { font-size: 12px; color: var(--text-light); min-width: 28px; }
}

/* Commentary section */
.commentary-section {
  background: var(--card); border-radius: 10px; padding: 20px 24px;
  margin-bottom: 20px; box-shadow: 0 1px 8px rgba(26,60,42,0.08);
}
.commentary-section h3 {
  font-size: 16px; color: var(--green-deep); margin-bottom: 10px;
  border-bottom: 1px solid #e0d8cc; padding-bottom: 6px;
}
.commentary-section p {
  font-size: 14px; line-height: 1.9; text-indent: 2em;
  margin-bottom: 8px;
}
.commentary-section .cs-sub {
  font-size: 13px; color: var(--text-light); font-weight: 600;
  margin: 12px 0 6px; text-indent: 0;
}

/* Mobile */

/* 4K */
@media (min-width: 2560px) {
  :root { --sidebar-w: 500px; }
  .sidebar-header h2 { font-size: 32px; }
  .sidebar-header .sub { font-size: 18px; }
  .chapter-item { font-size: 22px; padding: 14px 28px 14px 40px; }
  .chapter-group-title { font-size: 18px; padding: 12px 28px; }
  .back-link { font-size: 20px; padding: 16px 28px; }
  .book-header h1 { font-size: 40px; letter-spacing: 12px; }
  .book-header .book-sub { font-size: 18px; }
  .hexagram-card { max-width: 1200px; padding: 60px 80px; }
  .hexagram-svg { width: 380px; height: 560px; padding: 36px 44px; }
  .hexagram-card .hc-name { font-size: 64px; }
  .hexagram-card .hc-structure { font-size: 24px; }
  .hexagram-card .hc-judgment { font-size: 30px; max-width: 900px; }
  .hexagram-card .hc-lines { max-width: 900px; font-size: 24px; line-height: 2.4; }
  .hexagram-card .hc-lines .line .ln-name { font-size: 20px; min-width: 80px; }
  .hexagram-card .hc-commentary { font-size: 22px; max-width: 900px; padding: 20px 32px; }
  .hexagram-card .hc-commentary .cm-label { font-size: 18px; }
  .commentary-section { padding: 80px 60px; max-width: 1200px; }
  .commentary-section h3 { font-size: 32px; }
  .commentary-section p { font-size: 24px; line-height: 2.2; }
}
</style>
</head>
<body>

<div class="sidebar" id="bookSidebar">
  <div class="sidebar-header">
    <h2>📚 易经</h2>
    <div class="sub">周易·六十四卦</div>
  </div>
  <div class="back-link" onclick="sessionStorage.setItem('returnTo','library');window.location.href='/'">← 返回藏书阁</div>
  <div class="chapter-list" id="chapterList"></div>
</div>

<div class="content" id="bookContent">
  <div class="book-header">
    <h1>周 易</h1>
    <div class="book-sub">《易经》· 群经之首</div>
  </div>
  <!-- Mobile chapter nav (hidden on desktop) -->
  <div class="mobile-chapter-nav">
    <button class="mc-toggle" onclick="this.classList.toggle('open');document.getElementById('mcList').classList.toggle('open')">
      📖 章节目录 <span class="mc-arrow">▾</span>
    </button>
    <div class="mc-list" id="mcList"></div>
  </div>
  <div id="bookBody"></div>
</div>

<script>
// ===== 易经全文数据 =====
const BOOK_CHAPTERS = [];

// 上经 30卦
const SHANGJING = [
  { num: 1, name: '乾', struct: '乾上乾下', judgment: '乾：元亨利贞。',
    lines: ['初九：潜龙勿用。','九二：见龙在田，利见大人。','九三：君子终日乾乾，夕惕若厉，无咎。','九四：或跃在渊，无咎。','九五：飞龙在天，利见大人。','上九：亢龙有悔。','用九：见群龙无首，吉。'],
    tuan: '大哉乾元，万物资始，乃统天。云行雨施，品物流形。大明终始，六位时成。时乘六龙以御天。乾道变化，各正性命。保合太和，乃利贞。首出庶物，万国咸宁。',
    xiang: '天行健，君子以自强不息。' },
  { num: 2, name: '坤', struct: '坤上坤下', judgment: '坤：元亨。利牝马之贞。君子有攸往，先迷后得主。利西南得朋，东北丧朋。安贞吉。',
    lines: ['初六：履霜，坚冰至。','六二：直方大，不习无不利。','六三：含章可贞，或从王事，无成有终。','六四：括囊，无咎无誉。','六五：黄裳，元吉。','上六：龙战于野，其血玄黄。','用六：利永贞。'],
    tuan: '至哉坤元，万物资生，乃顺承天。坤厚载物，德合无疆。含弘光大，品物咸亨。牝马地类，行地无疆。柔顺利贞，君子攸行。先迷失道，后顺得常。',
    xiang: '地势坤，君子以厚德载物。' },
  { num: 3, name: '屯', struct: '震下坎上', judgment: '屯：元亨利贞。勿用有攸往，利建侯。',
    lines: ['初九：磐桓，利居贞，利建侯。','六二：屯如邅如，乘马班如，匪寇婚媾，女子贞不字，十年乃字。','六三：即鹿无虞，惟入于林中，君子几不如舍，往吝。','六四：乘马班如，求婚媾，往吉，无不利。','九五：屯其膏，小贞吉，大贞凶。','上六：乘马班如，泣血涟如。'] },
  { num: 4, name: '蒙', struct: '坎下艮上', judgment: '蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。',
    lines: ['初六：发蒙，利用刑人，用说桎梏，以往吝。','九二：包蒙，吉。纳妇，吉。子克家。','六三：勿用取女，见金夫，不有躬，无攸利。','六四：困蒙，吝。','六五：童蒙，吉。','上九：击蒙，不利为寇，利御寇。'] },
  { num: 5, name: '需', struct: '乾下坎上', judgment: '需：有孚，光亨，贞吉。利涉大川。',
    lines: ['初九：需于郊，利用恒，无咎。','九二：需于沙，小有言，终吉。','九三：需于泥，致寇至。','六四：需于血，出自穴。','九五：需于酒食，贞吉。','上六：入于穴，有不速之客三人来，敬之终吉。'] },
  { num: 6, name: '讼', struct: '坎下乾上', judgment: '讼：有孚，窒惕，中吉。终凶。利见大人，不利涉大川。',
    lines: ['初六：不永所事，小有言，终吉。','九二：不克讼，归而逋，其邑人三百户，无眚。','六三：食旧德，贞厉，终吉。或从王事，无成。','九四：不克讼，复即命，渝安贞，吉。','九五：讼，元吉。','上九：或锡之鞶带，终朝三褫之。'] },
  { num: 7, name: '师', struct: '坎下坤上', judgment: '师：贞丈人吉，无咎。',
    lines: ['初六：师出以律，否臧凶。','九二：在师中吉，无咎，王三锡命。','六三：师或舆尸，凶。','六四：师左次，无咎。','六五：田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。','上六：大君有命，开国承家，小人勿用。'] },
  { num: 8, name: '比', struct: '坤下坎上', judgment: '比：吉。原筮，元永贞，无咎。不宁方来，后夫凶。',
    lines: ['初六：有孚比之，无咎。有孚盈缶，终来有它，吉。','六二：比之自内，贞吉。','六三：比之匪人。','六四：外比之，贞吉。','九五：显比，王用三驱，失前禽，邑人不诫，吉。','上六：比之无首，凶。'] },
  { num: 9, name: '小畜', struct: '乾下巽上', judgment: '小畜：亨。密云不雨，自我西郊。',
    lines: ['初九：复自道，何其咎，吉。','九二：牵复，吉。','九三：舆说辐，夫妻反目。','六四：有孚，血去惕出，无咎。','九五：有孚挛如，富以其邻。','上九：既雨既处，尚德载，妇贞厉。月几望，君子征凶。'] },
  { num: 10, name: '履', struct: '兑下乾上', judgment: '履：履虎尾，不咥人，亨。',
    lines: ['初九：素履，往无咎。','九二：履道坦坦，幽人贞吉。','六三：眇能视，跛能履，履虎尾咥人，凶。武人为于大君。','九四：履虎尾，愬愬终吉。','九五：夬履，贞厉。','上九：视履考祥，其旋元吉。'] },
  { num: 11, name: '泰', struct: '乾下坤上', judgment: '泰：小往大来，吉亨。',
    lines: ['初九：拔茅茹，以其汇，征吉。','九二：包荒，用冯河，不遐遗，朋亡，得尚于中行。','九三：无平不陂，无往不复，艰贞无咎。勿恤其孚，于食有福。','六四：翩翩，不富以其邻，不戒以孚。','六五：帝乙归妹，以祉元吉。','上六：城复于隍，勿用师。自邑告命，贞吝。'] },
  { num: 12, name: '否', struct: '坤下乾上', judgment: '否：否之匪人，不利君子贞，大往小来。',
    lines: ['初六：拔茅茹，以其汇，贞吉亨。','六二：包承，小人吉，大人否亨。','六三：包羞。','九四：有命无咎，畴离祉。','九五：休否，大人吉。其亡其亡，系于苞桑。','上九：倾否，先否后喜。'] },
  { num: 13, name: '同人', struct: '离下乾上', judgment: '同人：同人于野，亨。利涉大川，利君子贞。',
    lines: ['初九：同人于门，无咎。','六二：同人于宗，吝。','九三：伏戎于莽，升其高陵，三岁不兴。','九四：乘其墉，弗克攻，吉。','九五：同人先号咷而后笑，大师克相遇。','上九：同人于郊，无悔。'] },
  { num: 14, name: '大有', struct: '乾下离上', judgment: '大有：元亨。',
    lines: ['初九：无交害，匪咎，艰则无咎。','九二：大车以载，有攸往，无咎。','九三：公用亨于天子，小人弗克。','九四：匪其彭，无咎。','六五：厥孚交如，威如，吉。','上九：自天祐之，吉无不利。'] },
  { num: 15, name: '谦', struct: '艮下坤上', judgment: '谦：亨，君子有终。',
    lines: ['初六：谦谦君子，用涉大川，吉。','六二：鸣谦，贞吉。','九三：劳谦君子，有终吉。','六四：无不利，撝谦。','六五：不富以其邻，利用侵伐，无不利。','上六：鸣谦，利用行师，征邑国。'] },
  { num: 16, name: '豫', struct: '坤下震上', judgment: '豫：利建侯行师。',
    lines: ['初六：鸣豫，凶。','六二：介于石，不终日，贞吉。','六三：盱豫，悔。迟有悔。','九四：由豫，大有得。勿疑，朋盍簪。','六五：贞疾，恒不死。','上六：冥豫，成有渝，无咎。'] },
  { num: 17, name: '随', struct: '震下兑上', judgment: '随：元亨利贞，无咎。',
    lines: ['初九：官有渝，贞吉。出门交有功。','六二：系小子，失丈夫。','六三：系丈夫，失小子。随有求得，利居贞。','九四：随有获，贞凶。有孚在道，以明，何咎。','九五：孚于嘉，吉。','上六：拘系之，乃从维之，王用亨于西山。'] },
  { num: 18, name: '蛊', struct: '巽下艮上', judgment: '蛊：元亨。利涉大川。先甲三日，后甲三日。',
    lines: ['初六：干父之蛊，有子，考无咎，厉终吉。','九二：干母之蛊，不可贞。','九三：干父之蛊，小有悔，无大咎。','六四：裕父之蛊，往见吝。','六五：干父之蛊，用誉。','上九：不事王侯，高尚其事。'] },
  { num: 19, name: '临', struct: '兑下坤上', judgment: '临：元亨利贞。至于八月有凶。',

  { num: 24, name: '复', struct: '震下坤上', judgment: '复：亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。',

  { num: 36, name: '明夷', struct: '离下坤上', judgment: '明夷：利艰贞。',
    lines: ['初九：明夷于飞，垂其翼。君子于行，三日不食。有攸往，主人有言。','六二：明夷，夷于左股，用拯马壮，吉。','九三：明夷于南狩，得其大首，不可疾贞。','六四：入于左腹，获明夷之心，于出门庭。','六五：箕子之明夷，利贞。','上六：不明晦，初登于天，后入于地。'] },
  { num: 37, name: '家人', struct: '离下巽上', judgment: '家人：利女贞。',
    lines: ['初九：闲有家，悔亡。','六二：无攸遂，在中馈，贞吉。','九三：家人嗃嗃，悔厉吉。妇子嘻嘻，终吝。','六四：富家，大吉。','九五：王假有家，勿恤，吉。','上九：有孚威如，终吉。'] },
  { num: 38, name: '睽', struct: '兑下离上', judgment: '睽：小事吉。',
    lines: ['初九：悔亡。丧马勿逐自复。见恶人无咎。','九二：遇主于巷，无咎。','六三：见舆曳，其牛掣，其人天且劓，无初有终。','九四：睽孤，遇元夫，交孚，厉无咎。','六五：悔亡，厥宗噬肤，往何咎。','上九：睽孤，见豕负涂，载鬼一车，先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。'] },
  { num: 39, name: '蹇', struct: '艮下坎上', judgment: '蹇：利西南，不利东北。利见大人，贞吉。',

  { num: 40, name: '解', struct: '坎下震上', judgment: '解：利西南。无所往，其来复吉。有攸往，夙吉。',

  { num: 41, name: '损', struct: '兑下艮上', judgment: '损：有孚，元吉，无咎，可贞，利有攸往。曷之用？二簋可用享。',
    lines: ['初九：已事遄往，无咎，酌损之。','九二：利贞，征凶，弗损益之。','六三：三人行，则损一人。一人行，则得其友。','六四：损其疾，使遄有喜，无咎。','六五：或益之十朋之龟，弗克违，元吉。','上九：弗损益之，无咎，贞吉，利有攸往，得臣无家。'] },
  { num: 42, name: '益', struct: '震下巽上', judgment: '益：利有攸往，利涉大川。',
    lines: ['初九：利用为大作，元吉，无咎。','六二：或益之十朋之龟，弗克违，永贞吉。王用享于帝，吉。','六三：益之用凶事，无咎。有孚中行，告公用圭。','六四：中行，告公从，利用为依迁国。','九五：有孚惠心，勿问元吉。有孚惠我德。','上九：莫益之，或击之，立心勿恒，凶。'] },
  { num: 43, name: '夬', struct: '乾下兑上', judgment: '夬：扬于王庭，孚号有厉。告自邑，不利即戎。利有攸往。',
    lines: ['初九：壮于前趾，往不胜为咎。','九二：惕号，莫夜有戎，勿恤。','九三：壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。','九四：臀无肤，其行次且。牵羊悔亡，闻言不信。','九五：苋陆夬夬，中行无咎。','上六：无号，终有凶。'] },
  { num: 44, name: '姤', struct: '巽下乾上', judgment: '姤：女壮，勿用取女。',
    lines: ['初六：系于金柅，贞吉。有攸往，见凶，羸豕孚蹢躅。','九二：包有鱼，无咎，不利宾。','九三：臀无肤，其行次且，厉，无大咎。','九四：包无鱼，起凶。','九五：以杞包瓜，含章，有陨自天。','上九：姤其角，吝，无咎。'] },
  { num: 45, name: '萃', struct: '坤下兑上', judgment: '萃：亨。王假有庙。利见大人，亨，利贞。用大牲吉，利有攸往。',
    lines: ['初六：有孚不终，乃乱乃萃，若号，一握为笑，勿恤，往无咎。','六二：引吉，无咎，孚乃利用禴。','六三：萃如嗟如，无攸利。往无咎，小吝。','九四：大吉，无咎。','九五：萃有位，无咎。匪孚，元永贞，悔亡。','上六：赍咨涕洟，无咎。'] },
  { num: 46, name: '升', struct: '巽下坤上', judgment: '升：元亨。用见大人，勿恤。南征吉。',

  { num: 47, name: '困', struct: '坎下兑上', judgment: '困：亨。贞大人吉，无咎。有言不信。',
    lines: ['初六：臀困于株木，入于幽谷，三岁不觌。','九二：困于酒食，朱绂方来，利用享祀，征凶，无咎。','六三：困于石，据于蒺藜，入于其宫，不见其妻，凶。','九四：来徐徐，困于金车，吝，有终。','九五：劓刖，困于赤绂，乃徐有说，利用祭祀。','上六：困于葛藟，于臲卼，曰动悔有悔，征吉。'] },
  { num: 48, name: '井', struct: '巽下坎上', judgment: '井：改邑不改井，无丧无得。往来井井。汔至亦未繘井，羸其瓶，凶。',
    lines: ['初六：井泥不食，旧井无禽。','九二：井谷射鲋，瓮敝漏。','九三：井渫不食，为我心恻。可用汲，王明并受其福。','六四：井甃，无咎。','九五：井洌寒泉，食。','上六：井收勿幕，有孚元吉。'] },
  { num: 49, name: '革', struct: '离下兑上', judgment: '革：己日乃孚。元亨利贞，悔亡。',

  { num: 50, name: '鼎', struct: '巽下离上', judgment: '鼎：元吉，亨。',
    lines: ['初六：鼎颠趾，利出否。得妾以其子，无咎。','九二：鼎有实，我仇有疾，不我能即，吉。','九三：鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉。','九四：鼎折足，覆公餗，其形渥，凶。','六五：鼎黄耳金铉，利贞。','上九：鼎玉铉，大吉，无不利。'] },
  { num: 51, name: '震', struct: '震上震下', judgment: '震：亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。',
    lines: ['初九：震来虩虩，后笑言哑哑，吉。','六二：震来厉，亿丧贝。跻于九陵，勿逐，七日得。','六三：震苏苏，震行无眚。','九四：震遂泥。','六五：震往来厉，亿无丧，有事。','上六：震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。'] },
  { num: 52, name: '艮', struct: '艮上艮下', judgment: '艮：艮其背，不获其身。行其庭，不见其人。无咎。',
    lines: ['初六：艮其趾，无咎，利永贞。','六二：艮其腓，不拯其随，其心不快。','九三：艮其限，列其夤，厉薰心。','六四：艮其身，无咎。','六五：艮其辅，言有序，悔亡。','上九：敦艮，吉。'] },
  { num: 53, name: '渐', struct: '艮下巽上', judgment: '渐：女归吉，利贞。',
    lines: ['初六：鸿渐于干。小子厉，有言，无咎。','六二：鸿渐于磐，饮食衎衎，吉。','九三：鸿渐于陆。夫征不复，妇孕不育，凶。利御寇。','六四：鸿渐于木，或得其桷，无咎。','九五：鸿渐于陵。妇三岁不孕，终莫之胜，吉。','上九：鸿渐于逵，其羽可用为仪，吉。'] },
  { num: 54, name: '归妹', struct: '兑下震上', judgment: '归妹：征凶，无攸利。',
    lines: ['初九：归妹以娣，跛能履，征吉。','九二：眇能视，利幽人之贞。','六三：归妹以须，反归以娣。','九四：归妹愆期，迟归有时。','六五：帝乙归妹，其君之袂不如其娣之袂良。月几望，吉。','上六：女承筐无实，士刲羊无血，无攸利。'] },
  { num: 55, name: '丰', struct: '离下震上', judgment: '丰：亨。王假之，勿忧，宜日中。',
    lines: ['初九：遇其配主，虽旬无咎，往有尚。','六二：丰其蔀，日中见斗，往得疑疾，有孚发若，吉。','九三：丰其沛，日中见沬，折其右肱，无咎。','九四：丰其蔀，日中见斗，遇其夷主，吉。','六五：来章有庆誉，吉。','上六：丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。'] },
  { num: 56, name: '旅', struct: '艮下离上', judgment: '旅：小亨。旅贞吉。',
    lines: ['初六：旅琐琐，斯其所取灾。','六二：旅即次，怀其资，得童仆贞。','九三：旅焚其次，丧其童仆，贞厉。','九四：旅于处，得其资斧，我心不快。','六五：射雉一矢亡，终以誉命。','上九：鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。'] },
  { num: 57, name: '巽', struct: '巽上巽下', judgment: '巽：小亨。利有攸往，利见大人。',
    lines: ['初六：进退，利武人之贞。','九二：巽在床下，用史巫纷若，吉无咎。','九三：频巽，吝。','六四：悔亡，田获三品。','九五：贞吉悔亡，无不利。无初有终。先庚三日，后庚三日，吉。','上九：巽在床下，丧其资斧，贞凶。'] },
  { num: 58, name: '兑', struct: '兑上兑下', judgment: '兑：亨，利贞。',

// ===== Hexagram SVG Generation =====
const TRIGRAM_LINES = {
  '乾': [1,1,1], '兑': [1,1,0], '离': [1,0,1], '震': [1,0,0],
  '巽': [0,1,1], '坎': [0,1,0], '艮': [0,0,1], '坤': [0,0,0]
};
function parseStructure(struct) {
  // Format: "震下坎上" or "乾上乾下"
  const upIdx = struct.indexOf('上');
  const downIdx = struct.indexOf('下');
  const upper = struct[upIdx - 1];
  const lower = struct[downIdx - 1];
  const uLines = TRIGRAM_LINES[upper] || [0,0,0];
  const lLines = TRIGRAM_LINES[lower] || [0,0,0];
  return [
    lLines[0], lLines[1], lLines[2],
    uLines[0], uLines[1], uLines[2]
  ]; // bottom to top
}
function hexagramSVG(lines) {
  // lines: array of 6 values (1=yang/solid, 0=yin/broken), bottom to top
  // SVG viewBox: 0 0 160 240
  const barW = 100, gap = 12, barH = 14, startY = 15;
  const step = 37;
  let svg = `<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg">`;
  // Background
  svg += `<rect width="160" height="240" rx="6" fill="#faf6ef"/>`;
  // Lines from top to bottom
  for (let i = 0; i < 6; i++) {
    const y = startY + i * step;
    const isYang = lines[5 - i] === 1; // read from top
    if (isYang) {
      svg += `<rect x="${(160-barW)/2}" y="${y}" width="${barW}" height="${barH}" rx="4" fill="#1a3c2a"/>`;
    } else {
      const segW = (barW - gap) / 2;
      svg += `<rect x="${(160-barW)/2}" y="${y}" width="${segW}" height="${barH}" rx="4" fill="#1a3c2a"/>`;
      svg += `<rect x="${(160-barW)/2 + segW + gap}" y="${y}" width="${segW}" height="${barH}" rx="4" fill="#1a3c2a"/>`;
    }
  }
  svg += `</svg>`;
  return svg;
}

function renderChapter(chapterIdx) {
  const body = document.getElementById('bookBody');
  body.innerHTML = '';
  
  const ch = BOOK_CHAPTERS[chapterIdx];
  
  if (ch.type === 'hexagram') {
    const h = ch.data;
    const lines = parseStructure(h.struct);
    const svgHtml = hexagramSVG(lines);
    const card = document.createElement('div'); card.className = 'hexagram-card';
    // Hexagram SVG + title row
    let html = `<div class="hc-svg-row">`;
    html += `<div class="hexagram-svg">${svgHtml}</div>`;
    html += `<div class="hc-title-group"><span class="hc-name">${h.name}卦</span><span class="hc-structure">${h.struct}</span></div>`;
    html += `</div>`;
    // Judgment
    html += `<div class="hc-judgment">${h.judgment}</div>`;
    // Divider
    html += `<div class="hc-divider"></div>`;
    // Lines
    html += `<div class="hc-lines">`;
    h.lines.forEach(l => {
      const colonIdx = l.indexOf('：');
      const name = l.substring(0, colonIdx);
      const text = l.substring(colonIdx + 1);
      html += `<div class="line"><span class="ln-name">${name}</span><span>${text}</span></div>`;
    });
    html += `</div>`;
    // Commentary
    if (h.tuan || h.xiang) {
      html += `<div class="hc-commentary">`;
      if (h.tuan) html += `<div><span class="cm-label">《彖》曰：</span>${h.tuan}</div>`;
      if (h.xiang) html += `<div><span class="cm-label">《象》曰：</span>${h.xiang}</div>`;
      html += `</div>`;
    }
    card.innerHTML = html;
    body.appendChild(card);
  } else if (ch.type === 'shiyi') {
    const sec = document.createElement('div'); sec.className = 'commentary-section';
    let html = `<h3>${ch.label}</h3>`;
    ch.data.forEach(p => {
      html += `<p>${p}</p>`;
    });
    sec.innerHTML = html;
    body.appendChild(sec);
  }
  
  // Update active chapter in sidebar
  document.querySelectorAll('.chapter-item').forEach((el, i) => {
    el.classList.toggle('active', i === chapterIdx);
  });
  
  // Update active chapter in mobile list
  document.querySelectorAll('.mc-item').forEach((el, i) => {
    el.classList.toggle('active', i === chapterIdx);
  });
  
  // Scroll to top of content
  document.querySelector('.content').scrollTop = 0;
}

function initBook() {
  // Build chapter list
  const list = document.getElementById('chapterList');
  
  // 上经
  let groupDiv = document.createElement('div'); groupDiv.className = 'chapter-group';
  let title = document.createElement('div'); title.className = 'chapter-group-title'; title.textContent = '上经';
  groupDiv.appendChild(title);
  SHANGJING.forEach((h, i) => {
    const idx = BOOK_CHAPTERS.length;
    BOOK_CHAPTERS.push({ type: 'hexagram', data: h, label: `${h.num}. ${h.name}卦` });
    const item = document.createElement('div'); item.className = 'chapter-item';
    item.innerHTML = `<span class="ci-num">${h.num}</span>${h.name}卦`;
    item.onclick = () => renderChapter(idx);
    groupDiv.appendChild(item);
  });
  list.appendChild(groupDiv);
  
  // 下经
  groupDiv = document.createElement('div'); groupDiv.className = 'chapter-group';
  title = document.createElement('div'); title.className = 'chapter-group-title'; title.textContent = '下经';
  groupDiv.appendChild(title);
  XIAJING.forEach((h, i) => {
    const idx = BOOK_CHAPTERS.length;
    BOOK_CHAPTERS.push({ type: 'hexagram', data: h, label: `${h.num}. ${h.name}卦` });
    const item = document.createElement('div'); item.className = 'chapter-item';
    item.innerHTML = `<span class="ci-num">${h.num}</span>${h.name}卦`;
    item.onclick = () => renderChapter(idx);
    groupDiv.appendChild(item);
  });
  list.appendChild(groupDiv);
  
  // 十翼
  groupDiv = document.createElement('div'); groupDiv.className = 'chapter-group';
  title = document.createElement('div'); title.className = 'chapter-group-title'; title.textContent = '十翼';
  groupDiv.appendChild(title);
  SHIYI.forEach(sy => {
    const idx = BOOK_CHAPTERS.length;
    BOOK_CHAPTERS.push({ type: 'shiyi', data: sy.content, label: sy.name });
    const item = document.createElement('div'); item.className = 'chapter-item';
    item.innerHTML = `<span class="ci-num">○</span>${sy.name}`;
    item.onclick = () => renderChapter(idx);
    groupDiv.appendChild(item);
  });
  list.appendChild(groupDiv);
  
  // Render first chapter
  renderChapter(0);

  // Also populate mobile chapter list
  populateMobileChapters();
}

function populateMobileChapters() {
  const mcList = document.getElementById('mcList');
  if (!mcList) return;
  BOOK_CHAPTERS.forEach((ch, i) => {
    const item = document.createElement('div'); item.className = 'mc-item';
    item.innerHTML = `<span class="mi-num">${ch.label.startsWith('○') ? '〇' : (parseInt(ch.label) || '')}</span>${ch.label.replace(/^\d+\.\s*/, '')}`;
    item.onclick = () => { renderChapter(i); mcList.classList.remove('open'); document.querySelector('.mc-toggle')?.classList.remove('open'); };
    mcList.appendChild(item);
  });
}

initBook();
